<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0f">

<title>Aiva — AI Assistant</title>

<style>
:root {
  --bg: #0b0b0f;
  --panel: #15161b;
  --panel-hover: #1c1d23;
  --text: #f5f5f7;
  --muted: #9699a3;
  --muted2: #696c76;
  --border: rgba(255,255,255,.08);
  --border-hover: rgba(255,255,255,.15);
  --accent: #7668ff;
  --accent2: #5c8cff;
  --user: #25272e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ================= HEADER ================= */

header {
  height: 62px;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(11,11,15,.9);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 20;
}

.logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg,#7668ff,#5c8cff);
  font-size: 18px;
  box-shadow: 0 6px 25px rgba(100,90,255,.22);
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand h1 {
  font-size: 16px;
  font-weight: 650;
}

.sub {
  font-size: 11px;
  color: var(--muted2);
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.spacer {
  flex: 1;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

button,
select,
textarea {
  font-family: inherit;
}

button {
  border: none;
  cursor: pointer;
}

.ghost {
  height: 36px;
  padding: 0 11px;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: 10px;
  transition: .18s;
}

.ghost:hover {
  background: var(--panel);
  color: var(--text);
  border-color: var(--border);
}

.icon-btn {
  width: 36px;
  padding: 0;
  font-size: 17px;
}

#model-select {
  height: 36px;
  max-width: 220px;
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 10px;
  outline: none;
  font-size: 12px;
}

/* ================= CHAT ================= */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20px 170px;
  scroll-behavior: smooth;
}

.chat-inner {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
}

/* ================= WELCOME ================= */

#welcome {
  min-height: calc(100vh - 250px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 15px;
}

.welcome-logo {
  width: 72px;
  height: 72px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg,#7668ff,#5c8cff);
  font-size: 34px;
  margin-bottom: 24px;
  box-shadow: 0 15px 60px rgba(91,105,255,.25);
}

#welcome h2 {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -.8px;
  margin-bottom: 9px;
}

#welcome p {
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 30px;
}

.quick-actions {
  width: 100%;
  max-width: 680px;
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.quick-card {
  background: rgba(255,255,255,.025);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  color: var(--text);
  text-align: left;
  transition: .18s;
}

.quick-card:hover {
  background: var(--panel);
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

.quick-icon {
  font-size: 19px;
  margin-bottom: 8px;
}

.quick-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 3px;
}

.quick-description {
  color: var(--muted2);
  font-size: 12px;
}

/* ================= MESSAGES ================= */

.msg {
  display: flex;
  gap: 12px;
  margin-bottom: 26px;
  animation: messageIn .2s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msg .ava {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.msg.ai .ava {
  background: linear-gradient(135deg,#7668ff,#5c8cff);
}

.msg.me {
  flex-direction: row-reverse;
}

.msg.me .ava {
  background: #24262d;
}

.msg > div:nth-child(2) {
  min-width: 0;
  max-width: 78%;
}

.content {
  background: transparent;
  border: none;
  padding: 1px 0;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.msg.me .content {
  background: var(--user);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: 17px;
  line-height: 1.5;
}

.content p {
  margin: 7px 0;
}

.content p:first-child {
  margin-top: 0;
}

.content p:last-child {
  margin-bottom: 0;
}

.content pre {
  background: #08090c;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 13px;
  overflow-x: auto;
  margin: 12px 0;
}

.content code {
  font-family: Consolas,monospace;
  font-size: 13px;
}

.content > code {
  background: rgba(255,255,255,.06);
  border-radius: 5px;
  padding: 2px 5px;
}

.msg.error .content {
  color: #ff8d8d;
}

/* ================= TOOLBAR ================= */

.toolbar {
  display: flex;
  gap: 3px;
  margin-top: 7px;
  opacity: 0;
  transition: opacity .15s;
}

.msg.ai:hover .toolbar {
  opacity: 1;
}

.toolbar button {
  background: transparent;
  color: var(--muted2);
  padding: 4px 7px;
  border-radius: 7px;
  font-size: 13px;
}

.toolbar button:hover {
  background: var(--panel);
  color: var(--text);
}

/* ================= INPUT ================= */

#inputbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px max(20px,calc((100vw - 820px)/2)) 18px;
  background: linear-gradient(to top,var(--bg) 70%,transparent);
  z-index: 15;
}

#attachbar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 8px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 6px 9px;
  font-size: 12px;
  max-width: 260px;
}

.chip span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chip button {
  background: transparent;
  color: var(--muted);
  padding: 0 2px;
}

.chip.err {
  color: #ff8d8d;
  border-color: rgba(255,80,80,.3);
}

#inputrow {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  max-width: 820px;
  margin: 0 auto;
  padding: 9px;
  background: rgba(21,22,27,.94);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
  backdrop-filter: blur(18px);
}

.round {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  padding: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 10px;
  font-size: 18px;
}

.round:hover {
  background: var(--panel-hover);
  color: var(--text);
}

.round.on {
  color: #ff5252;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% {
    opacity: .55;
  }
}

#inp {
  flex: 1;
  min-height: 38px;
  max-height: 160px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  padding: 9px 3px;
}

#inp::placeholder {
  color: var(--muted2);
}

#send {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 11px;
  background: var(--text);
  color: #0b0b0f;
  font-size: 17px;
  transition: .15s;
}

#send:hover {
  transform: scale(1.04);
}

#send:disabled {
  opacity: .55;
  cursor: wait;
}

/* ================= DROPZONE ================= */

#dropzone {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,.82);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 21px;
}

#dropzone.on {
  display: flex;
}

/* ================= PROMPT PANEL ================= */

#prompt-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 360px;
  max-width: 92vw;
  background: #121318;
  border-left: 1px solid var(--border);
  padding: 22px;
  transform: translateX(100%);
  transition: transform .25s ease;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: -20px 0 60px rgba(0,0,0,.25);
}

#prompt-panel.open {
  transform: none;
}

#prompt-panel h3 {
  font-size: 16px;
}

#prompt-panel textarea {
  flex: 1;
  background: #0b0b0f;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  padding: 13px;
  font-size: 14px;
  resize: none;
  outline: none;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
}

.slider-row input {
  flex: 1;
  accent-color: var(--accent);
}

.slider-row b {
  color: var(--text);
}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar {
  width: 7px;
}

::-webkit-scrollbar-thumb {
  background: #292b33;
  border-radius: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

/* ================= MOBILE ================= */

@media (max-width:700px) {

  header {
    height: 58px;
    min-height: 58px;
    padding: 0 12px;
  }

  .logo {
    width: 34px;
    height: 34px;
  }

  .brand h1 {
    font-size: 15px;
  }

  .header-actions {
    gap: 2px;
  }

  #model-select {
    display: none;
  }

  .header-actions .ghost {
    width: 34px;
    padding: 0;
  }

  #chat {
    padding: 24px 14px 150px;
  }

  #welcome {
    min-height: calc(100vh - 220px);
    padding: 25px 5px;
  }

  .welcome-logo {
    width: 64px;
    height: 64px;
    border-radius: 19px;
    font-size: 29px;
  }

  #welcome h2 {
    font-size: 25px;
  }

  #welcome p {
    font-size: 14px;
  }

  .quick-actions {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .quick-card {
    padding: 13px;
  }

  .quick-description {
    display: none;
  }

  .msg {
    gap: 8px;
    margin-bottom: 22px;
  }

  .msg .ava {
    width: 28px;
    height: 28px;
  }

  .msg > div:nth-child(2) {
    max-width: 88%;
  }

  .content {
    font-size: 14.5px;
  }

  #inputbar {
    padding: 7px 10px max(10px,env(safe-area-inset-bottom));
  }

  #inputrow {
    padding: 7px;
    border-radius: 16px;
  }

  #inp {
    font-size: 14px;
  }

  #prompt-panel {
    width: 100%;
    max-width: 100%;
  }
}

@media (max-width:420px) {

  .quick-actions {
    grid-template-columns: 1fr;
  }

  .quick-card {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .quick-icon {
    margin: 0;
  }

  .quick-title {
    margin: 0;
  }
}
</style>
</head>

<body>

<header>

<div id="chat">

    <div id="welcome">

        <button

        >

        >

</div>


<div id="dropzone">

  <div id="inputrow">

    <button
      id="attach-btn"

    >🎤</button>

<script>

const chat = document.getElementById('chat');
const chatInner = document.querySelector('.chat-inner');

const welcome = document.getElementById('welcome');

const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');

const modelInfo =
  document.getElementById('model-info');

const modelSelect =
  document.getElementById('model-select');

const fileInput =
  document.getElementById('file-input');

const attachBtn =
  document.getElementById('attach-btn');

const attachBar =
  document.getElementById('attachbar');

const dropzone =
  document.getElementById('dropzone');

const micBtn =
  document.getElementById('mic-btn');

let attachments = [];
let abortCtrl = null;


/* ================= MARKDOWN ================= */

function md(t) {

  let h = String(t)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  h = h.replace(
    /```(\w*)\n?([\s\S]*?)```/g,
    (m,l,c) =>
      '<pre><code>' +
      c.replace(/^\n|\n$/g,'') +
      '</code></pre>'
  );

  h = h.replace(
    /`([^`\n]+)`/g,
    '<code>$1</code>'
  );

  h = h.replace(
    /^###+ (.*)$/gm,
    '<b>$1</b>'
  );

  h = h.replace(
    /^## (.*)$/gm,
    '<b>$1</b>'
  );

  h = h.replace(
    /^# (.*)$/gm,
    '<b>$1</b>'
  );

  h = h.replace(
    /\*\*([^*]+)\*\*/g,
    '<b>$1</b>'
  );

  h = h
    .split(/\n{2,}/)
    .map(p =>
      /^<pre>/.test(p.trim())
        ? p
        : '<p>' +
          p.replace(/\n/g,'<br>') +
          '</p>'
    )
    .join('');

  return h;
}


/* ================= VOICE ================= */

function speak(text) {

  speechSynthesis.cancel();

  const lines = text
    .replace(/[#*`>\-]/g,' ')
    .split('\n')
    .filter(x => x.trim())
    .slice(0,12);

  const u =
    new SpeechSynthesisUtterance(
      lines.join('. ').slice(0,1200)
    );

  u.lang = 'ru-RU';
  u.rate = 1.05;

  speechSynthesis.speak(u);
}


/* ================= MESSAGES ================= */

function addMsg(role, text, error=false) {

  if (welcome) {
    welcome.style.display = 'none';
  }

  const d = document.createElement('div');

  d.className =
    'msg ' +
    (role === 'user' ? 'me' : 'ai') +
    (error ? ' error' : '');

  const ava =
    document.createElement('div');

  ava.className = 'ava';

  ava.textContent =
    role === 'user'
      ? '●'
      : '✦';

  const wrap =
    document.createElement('div');

  const c =
    document.createElement('div');

  c.className = 'content';

  if (error) {
    c.textContent = text;
  } else {
    c.innerHTML = md(text);
  }

  wrap.appendChild(c);

  if (!error && role !== 'user') {

    const tb =
      document.createElement('div');

    tb.className = 'toolbar';

    const bCopy =
      document.createElement('button');

    bCopy.textContent = '📋';
    bCopy.title = 'Скопировать';

    bCopy.onclick = () => {
      navigator.clipboard.writeText(text);
    };


    const bSpeak =
      document.createElement('button');

    bSpeak.textContent = '🔊';
    bSpeak.title = 'Озвучить';

    bSpeak.onclick = () =>
      speechSynthesis.speaking
        ? speechSynthesis.cancel()
        : speak(text);


    tb.append(bCopy,bSpeak);

    wrap.appendChild(tb);
  }

  d.append(ava,wrap);

  chatInner.appendChild(d);

  chat.scrollTop = chat.scrollHeight;

  return c;
}


/* ================= FILES ================= */

function renderAttach() {

  attachBar.innerHTML = '';

  attachments.forEach((a,i) => {

    const c =
      document.createElement('div');

    c.className =
      'chip' +
      (a.type === 'error' ? ' err' : '');

    const icon =
      a.type === 'image'
        ? '🖼️'
        : a.type === 'error'
          ? '⚠️'
          : '📄';

    const info =
      a.type === 'error'
        ? a.error
        : a.type === 'image'
          ? (a.size / 1024 | 0) + ' КБ'
          : a.size + ' симв.';

    c.innerHTML =
      `${icon}<span title="${a.name}">${a.name} · ${info}</span>`;

    const x =
      document.createElement('button');

    x.textContent = '✕';

    x.onclick = () => {
      attachments.splice(i,1);
      renderAttach();
    };

    c.appendChild(x);

    attachBar.appendChild(c);
  });
}


async function uploadFiles(files) {

  if (!files.length) return;

  const fd = new FormData();

  [...files]
    .slice(0,5)
    .forEach(f => fd.append('files',f));

  attachBtn.disabled = true;

  try {

    const r =
      await fetch('/api/upload',{
        method:'POST',
        body:fd
      });

    const d = await r.json();

    (d.files || []).forEach(f => {

      if (attachments.length < 5) {
        attachments.push(f);
      }

    });

    renderAttach();

  } catch(e) {

    addMsg(
      'ai',
      'Ошибка загрузки: ' + e.message,
      true
    );

  }

  attachBtn.disabled = false;

  fileInput.value = '';
}


attachBtn.onclick =
  () => fileInput.click();

fileInput.onchange =
  () => uploadFiles(fileInput.files);


let dragDepth = 0;

window.addEventListener(
  'dragenter',
  e => {

    e.preventDefault();

    dragDepth++;

    dropzone.classList.add('on');
  }
);

window.addEventListener(
  'dragleave',
  e => {

    e.preventDefault();

    dragDepth--;

    if (dragDepth <= 0) {

      dragDepth = 0;

      dropzone.classList.remove('on');
    }
  }
);

window.addEventListener(
  'dragover',
  e => e.preventDefault()
);

window.addEventListener(
  'drop',
  e => {

    e.preventDefault();

    dragDepth = 0;

    dropzone.classList.remove('on');

    uploadFiles(e.dataTransfer.files);
  }
);


/* ================= STREAM ================= */

async function streamRequest(
  url,
  payload,
  contentEl
) {

  abortCtrl =
    new AbortController();

  sendBtn.disabled = false;

  sendBtn.textContent = '■';

  let acc = '';

  try {

    const r =
      await fetch(url,{
        method:'POST',
        signal:abortCtrl.signal,
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify(payload)
      });

    if (!r.ok || !r.body) {
      throw new Error('HTTP ' + r.status);
    }

    const reader =
      r.body.getReader();

    const dec =
      new TextDecoder();

    let lineBuf = '';

    while(true) {

      const {
        done,
        value
      } = await reader.read();

      if(done) break;

      lineBuf +=
        dec.decode(value,{
          stream:true
        });

      const lines =
        lineBuf.split('\n');

      lineBuf = lines.pop();

      for(const line of lines) {

        if(!line.trim()) continue;

        let j;

        try {
          j = JSON.parse(line);
        } catch(e) {
          continue;
        }

        if(j.err) {

          contentEl.innerHTML =
            md(acc || '');

          addMsg(
            'ai',
            '⚠️ ' + j.err,
            true
          );

          return acc;
        }

        if(j.d) {

          acc += j.d;

          contentEl.textContent =
            acc;

          chat.scrollTop =
            chat.scrollHeight;
        }

        if(j.done && j.model) {

          modelInfo.textContent =
            j.model;
        }
      }
    }

  } catch(e) {

    if(e.name !== 'AbortError') {

      addMsg(
        'ai',
        '⚠️ ' + e.message,
        true
      );

      return acc;
    }
  }

  return acc;
}


function endGen() {

  sendBtn.textContent = '↑';

  abortCtrl = null;

  inp.focus();
}


/* ================= SEND ================= */

async function send() {

  const text =
    inp.value.trim();

  if(!text && !attachments.length) {
    return;
  }

  const atts =
    attachments.filter(
      a => a.type !== 'error'
    );

  const attNote =
    atts
      .map(a =>
        a.type === 'image'
          ? `[🖼️ ${a.name}]`
          : `[📄 ${a.name}]`
      )
      .join(' ');

  addMsg(
    'user',
    (text +
      (attNote
        ? '\n' + attNote
        : '')
    ).trim()
  );

  inp.value = '';

  inp.style.height = 'auto';

  attachments = [];

  renderAttach();

  sendBtn.disabled = true;

  const contentEl =
    addMsg(
      'ai',
      'печатает…'
    );

  const acc =
    await streamRequest(
      '/api/chat',
      {
        text,
        attachments: atts,
        stream: true
      },
      contentEl
    );

  contentEl.innerHTML =
    acc
      ? md(acc)
      : '<i>(пусто)</i>';

  chat.scrollTop =
    chat.scrollHeight;

  endGen();
}


sendBtn.onclick =
  () => abortCtrl
    ? abortCtrl.abort()
    : send();


inp.addEventListener(
  'keydown',
  e => {

    if(
      e.key === 'Enter' &&
      !e.shiftKey
    ) {

      e.preventDefault();

      send();
    }
  }
);


inp.addEventListener(
  'input',
  () => {

    inp.style.height = 'auto';

    inp.style.height =
      Math.min(
        inp.scrollHeight,
        160
      ) + 'px';
  }
);

document

        ...chatInner.querySelectorAll(
          '.msg.ai'
        )

    aiMsgs[aiMsgs.length - 1].remove();

        'печатает…'

    const acc =
      await streamRequest(
        '/api/regenerate',
        {stream:true},

    contentEl.innerHTML =

        : '<i>(пусто)</i>';

/* ================= MODEL ================= */

async function setModel(
  m,
  silent
) {

  await fetch(
    '/api/model',
    {
      method:'POST',
      headers:{
        'Content-Type':
          'application/json'
      },
      body:JSON.stringify({
        model:m
      })
    }
  );

  modelInfo.textContent =
    silent
      ? m
      : m + ' ✓';
}


modelSelect.onchange =
  () => {

    if(
      modelSelect.value ===
      'custom'
    ) {

      const m =
        prompt(
          'Вставь slug модели с openrouter.ai/models:',
          localStorage.myai_custom || ''
        );

      if(!m) {

        modelSelect.value =
          localStorage.myai_model ||
          'openrouter/free';

        return;
      }

      localStorage.myai_custom = m;

      if(
        ![
          ...modelSelect.options
        ].some(o => o.value === m)
      ) {

        modelSelect.add(
          new Option(m,m)
        );
      }

      modelSelect.value = m;

      localStorage.myai_model = m;

      setModel(m);

    } else {

      localStorage.myai_model =
        modelSelect.value;

      setModel(
        modelSelect.value
      );
    }
  };


/* ================= EXPORT ================= */

document
  .getElementById('export-btn')
  .onclick = async () => {

    const d =
      await (
        await fetch('/api/config')
      ).json();

    const mdText =
      (d.history || [])
        .map(
          m =>
            `**${
              m.role === 'user'
                ? 'Я'
                : 'Aiva'
            }:**\n\n${m.content}\n`
        )
        .join('\n---\n\n');

    const blob =
      new Blob(
        [
          `# Aiva — экспорт чата\n\n${mdText}`
        ],
        {
          type:'text/markdown'
        }
      );

    const a =
      document.createElement('a');

    a.href =
      URL.createObjectURL(blob);

    a.download =
      'aiva-chat.md';

    a.click();

    URL.revokeObjectURL(a.href);
  };


/* ================= VOICE ================= */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SR) {

  micBtn.style.display = '';

  let rec = null;

  let recording = false;

  micBtn.onclick = () => {

    if(recording) {

      rec.stop();

      return;
    }

    rec =
      new SR();

    rec.lang = 'ru-RU';

    rec.interimResults = false;

    rec.onresult =
      e => {

        inp.value =
          (
            inp.value
              ? inp.value + ' '
              : ''
          ) +
          e.results[0][0]
            .transcript;

        inp.dispatchEvent(
          new Event('input')
        );
      };

    rec.onend =
      () => {

        recording = false;

        micBtn.classList.remove(
          'on'
        );
      };

    rec.onerror =
      () => {

        recording = false;

        micBtn.classList.remove(
          'on'
        );
      };

    recording = true;

    micBtn.classList.add('on');

    rec.start();
  };
}

/* ================= INIT ================= */

(async () => {

  try {

    const d =
      await (
        await fetch('/api/config')
      ).json();

    modelInfo.textContent =
      d.model;

    document.getElementById(
      'prompt-text'
    ).value =
      d.systemPrompt || '';

    if(
      d.temperature != null
    ) {

      tempInput.value =
        d.temperature;

      tempVal.textContent =
        d.temperature;
    }

    if(!d.hasKey) {

      addMsg(
        'ai',
        '⚠️ Ключ API не задан. Перезапусти сервер так: set AI_API_KEY=sk-... && npm start',
        true
      );
    }

    const saved =
      localStorage.myai_model;

    if(
      saved &&
      [
        ...modelSelect.options
      ].some(o => o.value === saved)
    ) {

      modelSelect.value = saved;
    }

    if(
      saved &&
      saved !== d.model
    ) {

      setModel(
        saved,
        true
      );
    }

    if(
      localStorage.myai_custom &&
      ![
        ...modelSelect.options
      ].some(
        o =>
          o.value ===
          localStorage.myai_custom
      )
    ) {

      modelSelect.add(
        new Option(
          localStorage.myai_custom,
          localStorage.myai_custom
        )
      );
    }

    (d.history || [])
      .forEach(
        m =>
          addMsg(
            m.role,
            m.content
          )
      );

  } catch(e) {

    addMsg(
      'ai',
      'Не удалось загрузить конфигурацию: ' +
      e.message,
      true
    );
  }

})();
