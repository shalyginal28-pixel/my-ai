<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0f">

<title>Aiva — AI Assistant</title>

<style>
:root{
  --bg:#0b0b0f;
  --sidebar:#101116;
  --panel:#15161b;
  --panel2:#1b1c22;
  --hover:#202128;
  --text:#f5f5f7;
  --muted:#999ca7;
  --muted2:#696c76;
  --border:rgba(255,255,255,.08);
  --accent:#7668ff;
  --accent2:#5c8cff;
  --user:#25272e;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* ================= APP ================= */

#app{
  width:100%;
  height:100%;
  display:flex;
}

/* ================= SIDEBAR ================= */

#sidebar{
  width:270px;
  height:100%;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:12px;
  flex-shrink:0;
  transition:transform .25s ease;
  z-index:80;
}

.sidebar-top{
  display:flex;
  align-items:center;
  gap:9px;
  padding:4px 3px 14px;
}

.aiva-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 7px 25px rgba(100,90,255,.2);
  font-size:17px;
}

.aiva-name{
  font-size:16px;
  font-weight:700;
}

.sidebar-close{
  margin-left:auto;
  width:32px;
  height:32px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  display:none;
}

.sidebar-close:hover{
  background:var(--hover);
  color:var(--text);
}

.new-chat{
  width:100%;
  height:42px;
  border-radius:11px;
  background:var(--text);
  color:#0b0b0f;
  font-weight:650;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.15s;
}

.new-chat:hover{
  transform:translateY(-1px);
}

.history-title{
  color:var(--muted2);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:20px 8px 8px;
}

#history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  margin-bottom:3px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-size:13px;
  transition:.15s;
}

.history-item:hover{
  background:var(--hover);
  color:var(--text);
}

.history-item.active{
  background:var(--panel2);
  color:var(--text);
}

.history-icon{
  width:20px;
  flex-shrink:0;
  color:var(--muted2);
}

.history-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.sidebar-action{
  width:100%;
  min-height:40px;
  padding:8px 10px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.sidebar-action:hover{
  background:var(--hover);
  color:var(--text);
}

/* ================= MAIN ================= */

#main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ================= HEADER ================= */

header{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(11,11,15,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}

.menu-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:19px;
  display:none;
}

.menu-btn:hover{
  background:var(--panel);
  color:var(--text);
}

.header-brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-logo{
  width:35px;
  height:35px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:17px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand h1{
  font-size:15px;
  font-weight:700;
}

.sub{
  font-size:10px;
  color:var(--muted2);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:220px;
}

.spacer{
  flex:1;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.ghost{
  height:36px;
  padding:0 10px;
  background:transparent;
  color:var(--muted);
  border:1px solid transparent;
  border-radius:9px;
  transition:.15s;
}

.ghost:hover{
  background:var(--panel);
  color:var(--text);
  border-color:var(--border);
}

.icon-btn{
  width:36px;
  padding:0;
  font-size:16px;
}

/* ================= CHAT ================= */

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 20px 170px;
  scroll-behavior:smooth;
}

.chat-inner{
  width:100%;
  max-width:820px;
  margin:0 auto;
}

/* ================= WELCOME ================= */

#welcome{
  min-height:calc(100vh - 245px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 15px;
}

.welcome-logo{
  width:74px;
  height:74px;
  border-radius:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:34px;
  margin-bottom:22px;
  box-shadow:0 15px 60px rgba(91,105,255,.22);
}

#welcome h2{
  font-size:30px;
  font-weight:650;
  letter-spacing:-.8px;
  margin-bottom:8px;
}

#welcome p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.quick-actions{
  width:100%;
  max-width:680px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.quick-card{
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  color:var(--text);
  text-align:left;
  transition:.18s;
}

.quick-card:hover{
  background:var(--panel);
  border-color:rgba(255,255,255,.15);
  transform:translateY(-1px);
}

.quick-icon{
  font-size:18px;
  margin-bottom:7px;
}

.quick-title{
  font-size:13px;
  font-weight:650;
  margin-bottom:3px;
}

.quick-description{
  color:var(--muted2);
  font-size:11px;
}

/* ================= MESSAGES ================= */

.msg{
  display:flex;
  gap:11px;
  margin-bottom:25px;
  animation:messageIn .2s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.msg .ava{
  width:30px;
  height:30px;
  flex-shrink:0;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.msg.ai .ava{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.msg.me{
  flex-direction:row-reverse;
}

.msg.me .ava{
  background:#24262d;
}

.msg > div:nth-child(2){
  min-width:0;
  max-width:78%;
}

.content{
  background:transparent;
  border:0;
  padding:1px 0;
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.msg.me .content{
  background:var(--user);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:17px;
  line-height:1.5;
}

.content p{
  margin:7px 0;
}

.content p:first-child{
  margin-top:0;
}

.content p:last-child{
  margin-bottom:0;
}

.content pre{
  background:#08090c;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  overflow-x:auto;
  margin:12px 0;
}

.content code{
  font-family:Consolas,monospace;
  font-size:13px;
}

.content>code{
  background:rgba(255,255,255,.06);
  border-radius:5px;
  padding:2px 5px;
}

.msg.error .content{
  color:#ff8d8d;
}

.toolbar{
  display:flex;
  gap:3px;
  margin-top:7px;
  opacity:0;
  transition:opacity .15s;
}

.msg.ai:hover .toolbar{
  opacity:1;
}

.toolbar button{
  background:transparent;
  color:var(--muted2);
  padding:4px 7px;
  border-radius:7px;
  font-size:12px;
}

.toolbar button:hover{
  background:var(--panel);
  color:var(--text);
}

/* ================= INPUT ================= */

#inputbar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px max(20px,calc((100vw - 820px)/2)) 18px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  z-index:15;
}

#attachbar{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:8px;
}

.chip{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  max-width:260px;
}

.chip span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chip button{
  background:transparent;
  color:var(--muted);
  padding:0 2px;
}

.chip.err{
  color:#ff8d8d;
  border-color:rgba(255,80,80,.3);
}

#inputrow{
  display:flex;
  align-items:flex-end;
  gap:7px;
  max-width:820px;
  margin:0 auto;
  padding:9px;
  background:rgba(21,22,27,.94);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
  backdrop-filter:blur(18px);
}

.round{
  width:38px;
  height:38px;
  flex-shrink:0;
  padding:0;
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  font-size:18px;
}

.round:hover{
  background:var(--hover);
  color:var(--text);
}

.round.on{
  color:#ff5252;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.55}
}

#inp{
  flex:1;
  min-height:38px;
  max-height:160px;
  background:transparent;
  border:0;
  outline:0;
  resize:none;
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  padding:9px 3px;
}

#inp::placeholder{
  color:var(--muted2);
}

#send{
  width:38px;
  height:38px;
  flex-shrink:0;
  border-radius:11px;
  background:var(--text);
  color:#0b0b0f;
  font-size:17px;
  transition:.15s;
}

#send:hover{
  transform:scale(1.04);
}

#send:disabled{
  opacity:.55;
  cursor:wait;
}

/* ================= DROPZONE ================= */

#dropzone{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  background:rgba(10,10,15,.82);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:21px;
}

#dropzone.on{
  display:flex;
}

/* ================= PROMPT PANEL ================= */

#prompt-panel{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  width:370px;
  max-width:92vw;
  background:#121318;
  border-left:1px solid var(--border);
  padding:22px;
  transform:translateX(100%);
  transition:transform .25s ease;
  z-index:90;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:-20px 0 60px rgba(0,0,0,.25);
}

#prompt-panel.open{
  transform:none;
}

#prompt-panel h3{
  font-size:16px;
}

#prompt-text{
  flex:1;
  background:#0b0b0f;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  padding:13px;
  font-size:14px;
  resize:none;
  outline:none;
}

.slider-row{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:var(--muted);
}

.slider-row input{
  flex:1;
  accent-color:var(--accent);
}

.slider-row b{
  color:var(--text);
}

.save-btn{
  height:40px;
  border-radius:10px;
  background:var(--text);
  color:#0b0b0f;
  font-weight:650;
}

/* ================= MOBILE ================= */

#sidebar-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(2px);
  z-index:70;
}

::-webkit-scrollbar{
  width:7px;
}

::-webkit-scrollbar-thumb{
  background:#292b33;
  border-radius:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

@media(max-width:800px){

  #sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
    box-shadow:20px 0 60px rgba(0,0,0,.35);
  }

  #sidebar.open{
    transform:none;
  }

  .sidebar-close{
    display:block;
  }

  #sidebar-overlay.on{
    display:block;
  }

  .menu-btn{
    display:block;
  }

  header{
    height:58px;
    min-height:58px;
    padding:0 10px;
  }

  .header-actions{
    gap:2px;
  }

  .header-actions .ghost{
    width:34px;
    padding:0;
  }

  #chat{
    padding:22px 13px 150px;
  }

  #welcome{
    min-height:calc(100vh - 220px);
    padding:25px 5px;
  }

  .welcome-logo{
    width:64px;
    height:64px;
    border-radius:19px;
    font-size:29px;
  }

  #welcome h2{
    font-size:25px;
  }

  #welcome p{
    font-size:14px;
  }

  .quick-actions{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .quick-card{
    padding:13px;
  }

  .quick-description{
    display:none;
  }

  .msg{
    gap:8px;
    margin-bottom:22px;
  }

  .msg .ava{
    width:28px;
    height:28px;
  }

  .msg>div:nth-child(2){
    max-width:88%;
  }

  .content{
    font-size:14.5px;
  }

  #inputbar{
    padding:7px 10px max(10px,env(safe-area-inset-bottom));
  }

  #inputrow{
    padding:7px;
    border-radius:16px;
  }

  #inp{
    font-size:14px;
  }

  #prompt-panel{
    width:100%;
    max-width:100%;
  }
}

@media(max-width:420px){

  .quick-actions{
    grid-template-columns:1fr;
  }

  .quick-card{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .quick-icon{
    margin:0;
  }

  .quick-title{
    margin:0;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->

  <aside id="sidebar">

    <div class="sidebar-top">

      <div class="aiva-mark">✦</div>

      <div class="aiva-name">Aiva</div>

      <button
        class="sidebar-close"
        id="sidebar-close"
      >×</button>

    </div>

    <button
      class="new-chat"
      id="new-chat"
    >
      <span>＋</span>
      <span>Новый чат</span>
    </button>

    <div class="history-title">
      История
    </div>

    <div id="history"></div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-action"
        id="sidebar-prompt"
      >
        <span>🎭</span>
        <span>Характер Aiva</span>
      </button>

    </div>

  </aside>

  <div id="sidebar-overlay"></div>


  <!-- MAIN -->

  <main id="main">

    <header>

      <button
        class="menu-btn"
        id="menu-btn"
      >☰</button>

      <div class="header-brand">

        <div class="header-logo">
          ✦
        </div>

        <div class="brand">

          <h1>Aiva</h1>

          <div
            class="sub"
            id="model-info"
          >
            Твой AI-ассистент
          </div>

        </div>

      </div>

      <div class="spacer"></div>

      <div class="header-actions">

        <button
          class="ghost icon-btn"
          id="regen-btn"
          title="Перегенерировать"
        >↻</button>

        <button
          class="ghost icon-btn"
          id="export-btn"
          title="Экспорт"
        >↓</button>

        <button
          class="ghost"
          id="prompt-btn"
          title="Характер Aiva"
        >🎭</button>

        <button
          class="ghost icon-btn"
          id="clear-btn"
          title="Очистить"
        >⌫</button>

      </div>

    </header>


    <!-- CHAT -->

    <div id="chat">

      <div class="chat-inner">

        <div id="welcome">

          <div class="welcome-logo">
            ✦
          </div>

          <h2>
            Чем могу помочь?
          </h2>

          <p>
            Я Aiva — твой AI-ассистент.
          </p>

          <div class="quick-actions">

            <button
              class="quick-card"
              data-prompt="Помоги мне написать текст"
            >
              <div class="quick-icon">✍️</div>

              <div>
                <div class="quick-title">
                  Написать текст
                </div>

                <div class="quick-description">
                  Пост, письмо, описание или идея
                </div>
              </div>
            </button>


            <button
              class="quick-card"
              data-prompt="Придумай мне несколько интересных идей"
            >
              <div class="quick-icon">💡</div>

              <div>
                <div class="quick-title">
                  Придумать идею
                </div>

                <div class="quick-description">
                  Креатив, проект или бизнес
                </div>
              </div>
            </button>


            <button
              class="quick-card"
              data-prompt="Помоги мне разобраться с кодом"
            >
              <div class="quick-icon">💻</div>

              <div>
                <div class="quick-title">
                  Помочь с кодом
                </div>

                <div class="quick-description">
                  Найди ошибку или напиши код
                </div>
              </div>
            </button>


            <button
              class="quick-card"
              data-prompt="Объясни мне сложную тему простыми словами"
            >
              <div class="quick-icon">🧠</div>

              <div>
                <div class="quick-title">
                  Объяснить
                </div>

                <div class="quick-description">
                  Разберём любую тему
                </div>
              </div>
            </button>

          </div>

        </div>

      </div>

    </div>


    <!-- DROPZONE -->

    <div id="dropzone">
      Отпусти файлы — прикреплю 📎
    </div>


    <!-- INPUT -->

    <div id="inputbar">

      <div
        id="attachbar"
        class="chat-inner"
      ></div>

      <div id="inputrow">

        <button
          id="attach-btn"
          class="round"
          title="Прикрепить файл"
        >+</button>

        <button
          id="mic-btn"
          class="round"
          title="Голосовой ввод"
          style="display:none"
        >🎤</button>

        <textarea
          id="inp"
          rows="1"
          placeholder="Сообщение Aiva..."
        ></textarea>

        <button id="send">
          ↑
        </button>

      </div>

    </div>

  </main>

</div>


<input
  type="file"
  id="file-input"
  multiple
  hidden
>


<!-- PROMPT PANEL -->

<div id="prompt-panel">

  <h3>
    🎭 Характер Aiva
  </h3>

  <div
    class="sub"
    style="font-size:12px"
  >
    Системный промпт задаёт стиль
    и поведение ассистента.
  </div>

  <textarea id="prompt-text"></textarea>

  <div class="slider-row">

    🌡

    <span>

  document.getElementById('temp');

const tempVal =

let attachments = [];

/* =========================================================
   LOCAL CHAT HISTORY
========================================================= */

const HISTORY_KEY =
  'aiva_chat_history_v1';

let chats = [];

let activeChatId = null;


function loadChats(){

  try{

    chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || '[]'
      );

    if(!Array.isArray(chats)){
      chats = [];
    }

  }catch(e){

    chats = [];

  }

}


function saveChats(){

  try{

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(chats)
    );

  }catch(e){}

}


function createChat(){

  const chatData = {

    id:
      Date.now().toString(),

    title:
      'Новый чат',

    messages:[],

    created:
      Date.now()

  };

  chats.unshift(chatData);

  activeChatId =
    chatData.id;

  saveChats();

  renderHistory();

}


function getActiveChat(){

  return chats.find(
    c => c.id === activeChatId
  );

}


function makeTitle(text){

  const clean =
    String(text)
      .replace(/\s+/g,' ')
      .trim();

  if(!clean){
    return 'Новый чат';
  }

  return clean.length > 38
    ? clean.slice(0,38) + '…'
    : clean;

}


function saveCurrentMessages(){

  const current =
    getActiveChat();

  if(!current){
    return;
  }

  const messages =
    [
      ...chatInner.querySelectorAll(
        '.msg'
      )
    ];

  current.messages =
    messages.map(m => {

      const role =
        m.classList.contains('me')
          ? 'user'
          : 'assistant';

      const content =
        m.querySelector('.content');

      return {

        role,

        content:
          content
            ? content.innerText
            : ''

      };

    });

  const firstUser =
    current.messages.find(
      m => m.role === 'user'
    );

  if(firstUser){

    current.title =
      makeTitle(
        firstUser.content
      );

  }

  saveChats();

  renderHistory();

}


function renderHistory(){

  historyEl.innerHTML = '';

  chats
    .slice(0,30)

      const b =
        document.createElement('button');

      b.className =

        <span class="history-icon">◌</span>

      b.onclick =

/* =========================================================
   MARKDOWN
========================================================= */

function md(t){

  let h =
    String(t)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  h =
    h.replace(
      /```(\w*)\n?([\s\S]*?)```/g,
      (m,l,c) =>
        '<pre><code>' +
        c.replace(/^\n|\n$/g,'') +
        '</code></pre>'
    );

  h =
    h.replace(
      /`([^`\n]+)`/g,
      '<code>$1</code>'
    );

  h =
    h.replace(
      /^###+ (.*)$/gm,
      '<b>$1</b>'
    );

  h =
    h.replace(
      /^## (.*)$/gm,
      '<b>$1</b>'
    );

  h =
    h.replace(
      /^# (.*)$/gm,
      '<b>$1</b>'
    );

  h =
    h.replace(
      /\*\*([^*]+)\*\*/g,
      '<b>$1</b>'
    );

  h =
    h
      .split(/\n{2,}/)
      .map(p =>
        /^<pre>/.test(p.trim())
          ? p
          : '<p>' +
            p.replace(
              /\n/g,
              '<br>'
            ) +
            '</p>'
      )
      .join('');

  return h;

}


/* =========================================================
   VOICE OUTPUT
========================================================= */

function speak(text){

  if(
    !window.speechSynthesis
  ){
    return;
  }

  speechSynthesis.cancel();

  const lines =
    String(text)
      .replace(/[#*`>\-]/g,' ')
      .split('\n')
      .filter(x => x.trim())
      .slice(0,12);

  const u =
    new SpeechSynthesisUtterance(
      lines
        .join('. ')
        .slice(0,1200)
    );

  u.lang = 'ru-RU';

  u.rate = 1.05;

  speechSynthesis.speak(u);

}


/* =========================================================
   MESSAGES
========================================================= */

function addMsg(
  role,
  text,
  error=false,
  silent=false
){

  const oldWelcome =
    document.getElementById(
      'welcome'
    );

  if(oldWelcome){
    oldWelcome.remove();
  }

  const d =
    document.createElement('div');

  d.className =
    'msg ' +
    (
      role === 'user'
        ? 'me'
        : 'ai'
    ) +
    (
      error
        ? ' error'
        : ''
    );

  const ava =
    document.createElement('div');

  ava.className =
    'ava';

  ava.textContent =
    role === 'user'
      ? '●'
      : '✦';

  const wrap =
    document.createElement('div');

  const c =
    document.createElement('div');

  c.className =
    'content';

  if(error){

    c.textContent = text;

  }else{

    c.innerHTML =
      md(text);

  }

  wrap.appendChild(c);

  if(
    !error &&
    role !== 'user'
  ){

    const tb =
      document.createElement('div');

    tb.className =
      'toolbar';

    const bCopy =
      document.createElement('button');

    bCopy.textContent = '📋';

    bCopy.title =
      'Скопировать';

    bCopy.onclick =
      () => {

        navigator.clipboard
          .writeText(text)
          .catch(()=>{});

      };


    const bSpeak =
      document.createElement('button');

    bSpeak.textContent = '🔊';

    bSpeak.title =
      'Озвучить';

    bSpeak.onclick =
      () => {

        if(
          window.speechSynthesis &&
          speechSynthesis.speaking
        ){

          speechSynthesis.cancel();

        }else{

          speak(text);

        }

      };

    tb.append(
      bCopy,
      bSpeak
    );

    wrap.appendChild(tb);

  }

  d.append(
    ava,
    wrap
  );

  chatInner.appendChild(d);

  chat.scrollTop =
    chat.scrollHeight;

  if(!silent){

    saveCurrentMessages();

  }

  return c;

}

   FILES
========================================================= */

function renderAttach(){

  attachBar.innerHTML = '';

  attachments.forEach(
    (a,i) => {

      const c =
        document.createElement('div');

      c.className =
        'chip' +
        (
          a.type === 'error'
            ? ' err'
            : ''
        );

      const icon =
        a.type === 'image'
          ? '🖼️'
          : a.type === 'error'
            ? '⚠️'
            : '📄';

      const info =
        a.type === 'error'
          ? a.error
          : a.type === 'image'
            ? (
                (a.size / 1024 | 0)
              ) + ' КБ'
            : a.size + ' симв.';

      const span =
        document.createElement('span');

      span.textContent =
        `${a.name} · ${info}`;

      span.title =
        a.name;

      c.append(
        document.createTextNode(icon),
        span
      );

      const x =
        document.createElement('button');

      x.textContent = '✕';

      x.onclick =
        () => {

          attachments.splice(i,1);

          renderAttach();

        };

      c.appendChild(x);

      attachBar.appendChild(c);

    }
  );

}


async function uploadFiles(files){

  if(!files.length){
    return;
  }

  const fd =
    new FormData();

  [...files]
    .slice(0,5)
    .forEach(
      f =>
        fd.append(
          'files',
          f
        )
    );

  attachBtn.disabled = true;

  try{

    const r =
      await fetch(
        '/api/upload',
        {
          method:'POST',
          body:fd
        }
      );

    const d =
      await r.json();

    (d.files || [])
      .forEach(f => {

        if(
          attachments.length < 5
        ){

          attachments.push(f);

        }

      });

    renderAttach();

  }catch(e){

    addMsg(
      'ai',
      'Ошибка загрузки: ' +
      e.message,
      true
    );

  }

  attachBtn.disabled = false;

  fileInput.value = '';

}


attachBtn.onclick =
  () =>
    fileInput.click();


fileInput.onchange =
  () =>
    uploadFiles(
      fileInput.files
    );


let dragDepth = 0;


window.addEventListener(
  'dragenter',
  e => {

    e.preventDefault();

    dragDepth++;

    dropzone.classList.add(
      'on'
    );

  }
);


window.addEventListener(
  'dragleave',
  e => {

    e.preventDefault();

    dragDepth--;

    if(
      dragDepth <= 0
    ){

      dragDepth = 0;

      dropzone.classList.remove(
        'on'
      );

    }

  }
);


window.addEventListener(
  'dragover',
  e =>
    e.preventDefault()
);


window.addEventListener(
  'drop',
  e => {

    e.preventDefault();

    dragDepth = 0;

    dropzone.classList.remove(
      'on'
    );

    uploadFiles(
      e.dataTransfer.files
    );

  }
);


/* =========================================================
   STREAM
========================================================= */

async function streamRequest(
  url,
  payload,
  contentEl
){

  abortCtrl =
    new AbortController();

  sendBtn.disabled = false;

  sendBtn.textContent = '■';

  let acc = '';

  try{

    const r =
      await fetch(
        url,
        {
          method:'POST',
          signal:
            abortCtrl.signal,
          headers:{
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify(
              payload
            )
        }
      );

    if(
      !r.ok ||
      !r.body
    ){

      throw new Error(
        'HTTP ' + r.status
      );

    }

    const reader =
      r.body.getReader();

    const dec =
      new TextDecoder();

    let lineBuf = '';

    while(true){

      const {
        done,
        value
      } =
        await reader.read();

      if(done){
        break;
      }

      lineBuf +=
        dec.decode(
          value,
          {stream:true}
        );

      const lines =
        lineBuf.split('\n');

      lineBuf =
        lines.pop();

      for(
        const line of lines
      ){

        if(
          !line.trim()
        ){
          continue;
        }

        let j;

        try{

          j =
            JSON.parse(line);

        }catch(e){

          continue;

        }

        if(j.err){

          contentEl.innerHTML =
            md(acc || '');

          addMsg(
            'ai',
            '⚠️ ' + j.err,
            true
          );

          return acc;

        }

        if(j.d){

          acc += j.d;

          contentEl.textContent =
            acc;

          chat.scrollTop =
            chat.scrollHeight;

        }

      }

    }

  }catch(e){

    if(
      e.name !== 'AbortError'
    ){

      addMsg(
        'ai',
        '⚠️ ' + e.message,
        true
      );

      return acc;

    }

  }

  return acc;

}


function endGen(){

  sendBtn.textContent = '↑';

  abortCtrl = null;

  sendBtn.disabled = false;

  inp.focus();

}


/* =========================================================
   SEND
========================================================= */

async function send(){

  const text =
    inp.value.trim();

  if(
    !text &&
    !attachments.length
  ){
    return;
  }

  if(!activeChatId){

    createChat();

  }

  const atts =
    attachments.filter(
      a =>
        a.type !== 'error'
    );

  const attNote =
    atts
      .map(
        a =>
          a.type === 'image'
            ? `[🖼️ ${a.name}]`
            : `[📄 ${a.name}]`
      )
      .join(' ');

  addMsg(
    'user',
    (
      text +
      (
        attNote
          ? '\n' + attNote
          : ''
      )
    ).trim()
  );

  inp.value = '';

  inp.style.height =
    'auto';

  attachments = [];

  renderAttach();

  sendBtn.disabled = true;

  const contentEl =
    addMsg(
      'ai',
      'печатает…'
    );

  const acc =
    await streamRequest(
      '/api/chat',
      {
        text,
        attachments:atts,
        stream:true
      },
      contentEl
    );

  contentEl.innerHTML =
    acc
      ? md(acc)
      : '<i>(пусто)</i>';

  chat.scrollTop =
    chat.scrollHeight;

  saveCurrentMessages();

  endGen();

}

        await (
          await fetch(

/* =========================================================
   VOICE INPUT
========================================================= */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SR){

  micBtn.style.display = '';

  let rec = null;

  let recording = false;

  micBtn.onclick =
    () => {

      if(recording){

        rec.stop();

        return;

      }

      rec =
        new SR();

      rec.lang =
        'ru-RU';

      rec.interimResults =
        false;

      rec.onresult =
        e => {

          inp.value =
            (
              inp.value
                ? inp.value + ' '
                : ''
            ) +
            e.results[0][0]
              .transcript;

          inp.dispatchEvent(
            new Event('input')
          );

        };

      rec.onend =
        () => {

          recording = false;

          micBtn.classList.remove(
            'on'
          );

        };

      rec.onerror =
        () => {

          recording = false;

          micBtn.classList.remove(
            'on'
          );

        };

      recording = true;

      micBtn.classList.add(
        'on'
      );

      rec.start();

    };

}

  };


/* =========================================================
   CLEAR CHAT
========================================================= */

document
  .getElementById('clear-btn')
  .onclick =
  async () => {

    if(
      !confirm(
        'Очистить текущий диалог?'
      )
    ){

      return;

    }

    try{

      await fetch(
        '/api/clear',
        {
          method:'POST'
        }
      );

    }catch(e){}

    const current =
      getActiveChat();

    if(current){

      current.messages = [];

      current.title =
        'Новый чат';

      saveChats();

    }

    showWelcome();

    renderHistory();

  };


/* =========================================================
   INIT
========================================================= */

(async () => {

  loadChats();

  if(!chats.length){

    createChat();

  }else{

    activeChatId =
      chats[0].id;

  }

  renderHistory();

  try{

    const r =
      await fetch(
        '/api/config'
      );

    const d =
      await r.json();

    /*
      ВАЖНО:
      модель намеренно не показываем.
      Пользователь видит только бренд Aiva.
    */

    modelInfo.textContent =
      'Твой AI-ассистент';

    document.getElementById(
      'prompt-text'
    ).value =
      d.systemPrompt || '';

    if(
      d.temperature != null
    ){

      tempInput.value =
        d.temperature;

      tempVal.textContent =
        d.temperature;

    }

    if(!d.hasKey){

      addMsg(
        'ai',
        '⚠️ Ключ API не задан.',
        true
      );

    }

    const current =
      getActiveChat();

    if(
      current &&
      current.messages.length
    ){

      openChat(
        current.id
      );

    }else{

      showWelcome();

    }

  }catch(e){

    showWelcome();

    addMsg(
      'ai',
      'Не удалось загрузить конфигурацию: ' +
      e.message,
      true
    );

  }

})();

</script>

){
