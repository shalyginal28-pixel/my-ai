<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAI — мой ассистент</title>
<style>
  :root { --accent:#3390ec; --bg:#0e0f13; --panel:#17181d; --text:#e8e9ec; --muted:#8b8e98; --border:#26282f; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { height:100vh; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .logo { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#3390ec,#a05cd8);
    display:flex; align-items:center; justify-content:center; font-size:19px; }
  h1 { font-size:17px; }
  .sub { font-size:12px; color:var(--muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  button { border:none; border-radius:10px; padding:9px 12px; cursor:pointer; font-size:13.5px; transition:.15s; }
  .ghost { background:var(--panel); color:var(--muted); border:1px solid var(--border); }
  .ghost:hover { color:var(--text); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; font-size:13px; outline:none; max-width:250px; }
  #chat { flex:1; overflow-y:auto; padding:22px 16%; }
  @media (max-width:900px){ #chat{ padding:16px 4%; } }
  .msg { display:flex; gap:10px; margin-bottom:14px; }
  .msg .ava { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:15px; }
  .msg.ai .ava { background:linear-gradient(135deg,#3390ec,#a05cd8); }
  .msg.me { flex-direction:row-reverse; }
  .msg.me .ava { background:#2a2c34; }
  .content { max-width:75%; background:var(--panel); border:1px solid var(--border);
    padding:11px 15px; border-radius:14px; font-size:15px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .content pre { background:#0a0b0e; border:1px solid var(--border); border-radius:8px; padding:10px; overflow-x:auto; margin:8px 0; }
  .content code { font-family:Consolas,monospace; font-size:13px; }
  .content p { margin:6px 0; }
  .msg.me .content { background:linear-gradient(180deg,#2b83d9,#3390ec); border:none; }
  .msg.error .content { border-color:#e53935; color:#ff8a80; }
  .toolbar { display:flex; gap:4px; margin-top:5px; opacity:0; transition:.15s; }
  .msg.ai:hover .toolbar { opacity:1; }
  .toolbar button { background:none; border:none; padding:2px 6px; font-size:13px; color:var(--muted); }
  .toolbar button:hover { color:var(--text); transform:scale(1.15); }
  #inputbar { padding:10px 16% 6px; border-top:1px solid var(--border); }
  @media (max-width:900px){ #inputbar{ padding:10px 4% 6px; } }
  #attachbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:6px 10px; font-size:12.5px; max-width:260px; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.err { border-color:#e53935; color:#ff8a80; }
  .chip button { background:none; padding:0 2px; color:var(--muted); font-size:14px; }
  .chip button:hover { color:#ff8a80; }
  #inputrow { display:flex; gap:8px; padding-bottom:14px; }
  .round { background:var(--panel); color:var(--muted); border:1px solid var(--border); font-size:17px; padding:0 14px; }
  .round:hover { color:var(--text); }
  .round.on { color:#ff5252; border-color:#ff5252; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #inp { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    color:var(--text); padding:13px 16px; font-size:15px; outline:none; resize:none; font-family:inherit; }
  #inp:focus { border-color:var(--accent); }
  #send { background:var(--accent); color:#fff; font-size:16px; padding:0 20px; min-width:56px; }
  #send:hover { filter:brightness(1.15); }
  #send:disabled { opacity:.5; cursor:wait; }
  #dropzone { display:none; position:fixed; inset:0; background:rgba(20,30,50,.7); z-index:100;
    align-items:center; justify-content:center; font-size:22px; color:#fff; pointer-events:none; }
  #dropzone.on { display:flex; }
  #prompt-panel { position:fixed; top:0; right:0; bottom:0; width:340px; max-width:92vw; background:var(--panel);
    border-left:1px solid var(--border); padding:20px; transform:translateX(100%); transition:.25s; z-index:50;
    display:flex; flex-direction:column; gap:12px; }
  #prompt-panel.open { transform:none; }
  #prompt-panel h3 { font-size:15px; }
  #prompt-panel textarea { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:12px; font-size:14px; resize:none; outline:none; font-family:inherit; }
  .slider-row { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .slider-row input { flex:1; accent-color:var(--accent); }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:#33363f; border-radius:4px; }
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div><h1>MyAI</h1><div class="sub" id="model-info">загрузка…</div></div>
  <div class="spacer"></div>
  <select id="model-select" title="Модель">
    <option value="openrouter/free">openrouter/free (авто, надёжно)</option>
    <option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 3 Super 120B (рассуждения)</option>
    <option value="openai/gpt-oss-120b:free">GPT-OSS 120B (стабильная)</option>
    <option value="google/gemma-4-31b-it:free">Gemma 4 31B (быстрая)</option>
    <option value="custom">Своя модель…</option>
  </select>
  <button class="ghost" id="regen-btn" title="Перегенерировать последний ответ">🔄</button>
  <button class="ghost" id="export-btn" title="Скачать историю (.md)">⬇</button>
  <button class="ghost" id="prompt-btn">🎭 Характер</button>
  <button class="ghost" id="clear-btn">🗑</button>
</header>
<div id="chat"></div>
<div id="dropzone">Отпусти файлы — прикреплю 📎</div>
<div id="inputbar">
  <div id="attachbar"></div>
  <div id="inputrow">
    <button id="attach-btn" class="round" title="Прикрепить файл">📎</button>
    <button id="mic-btn" class="round" title="Голосовой ввод" style="display:none">🎤</button>
    <textarea id="inp" rows="1" placeholder="Напиши сообщение… (Enter — отправить)"></textarea>
    <button id="send">➤</button>
  </div>
</div>
<input type="file" id="file-input" multiple hidden>
<div id="prompt-panel">
  <h3>🎭 Характер ассистента</h3>
  <div class="sub" style="font-size:12px">Системный промпт — инструкция, задающая стиль и поведение.</div>
  <textarea id="prompt-text"></textarea>
  <div class="slider-row">🌡 Креативность <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7"><b id="temp-val">0.7</b></div>
  <button id="save-prompt" style="background:var(--accent);color:#fff">Сохранить</button>
  <button class="ghost" id="close-prompt">Закрыть</button>
</div>
<script>
const chat = document.getElementById('chat'), inp = document.getElementById('inp'), sendBtn = document.getElementById('send');
const modelInfo = document.getElementById('model-info'), modelSelect = document.getElementById('model-select');
const fileInput = document.getElementById('file-input'), attachBtn = document.getElementById('attach-btn');
const attachBar = document.getElementById('attachbar'), dropzone = document.getElementById('dropzone');
const micBtn = document.getElementById('mic-btn');
let attachments = [], abortCtrl = null;

function md(t) {
  let h = String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+c.replace(/^\n|\n$/g,'')+'</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/^###+ (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^# (.*)$/gm,'<b>$1</b>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.split(/\n{2,}/).map(p => /^<pre>/.test(p.trim()) ? p : '<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h;
}

function speak(text) {
  speechSynthesis.cancel();
  const lines = text.replace(/[#*`>\-]/g,' ').split('\n').filter(x=>x.trim()).slice(0,12);
  const u = new SpeechSynthesisUtterance(lines.join('. ').slice(0, 1200));
  u.lang = 'ru-RU'; u.rate = 1.05;
  speechSynthesis.speak(u);
}

function addMsg(role, text, error=false) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'me' : 'ai') + (error ? ' error' : '');
  const ava = document.createElement('div'); ava.className = 'ava'; ava.textContent = role === 'user' ? '🧑' : '🤖';
  const wrap = document.createElement('div');
  const c = document.createElement('div'); c.className = 'content';
  if (error) c.textContent = text; else c.innerHTML = md(text);
  wrap.appendChild(c);
  if (!error && role !== 'user') {
    const tb = document.createElement('div'); tb.className = 'toolbar';
    const bCopy = document.createElement('button'); bCopy.textContent = '📋'; bCopy.title = 'Скопировать';
    bCopy.onclick = () => navigator.clipboard.writeText(text);
    const bSpeak = document.createElement('button'); bSpeak.textContent = '🔊'; bSpeak.title = 'Озвучить';
    bSpeak.onclick = () => speechSynthesis.speaking ? speechSynthesis.cancel() : speak(text);
    tb.append(bCopy, bSpeak); wrap.appendChild(tb);
  }
  d.append(ava, wrap); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return c;
}

// ===== файлы =====
function renderAttach() {
  attachBar.innerHTML = '';
  attachments.forEach((a, i) => {
    const c = document.createElement('div');
    c.className = 'chip' + (a.type === 'error' ? ' err' : '');
    const icon = a.type === 'image' ? '🖼️' : a.type === 'error' ? '⚠️' : '📄';
    const info = a.type === 'error' ? a.error : (a.type === 'image' ? (a.size/1024|0)+' КБ' : a.size + ' симв.');
    c.innerHTML = `${icon}<span title="${a.name}">${a.name} · ${info}</span>`;
    const x = document.createElement('button'); x.textContent = '✕';
    x.onclick = () => { attachments.splice(i,1); renderAttach(); };
    c.appendChild(x); attachBar.appendChild(c);
  });
}
async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].slice(0, 5).forEach(f => fd.append('files', f));
  attachBtn.disabled = true;
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    (d.files || []).forEach(f => { if (attachments.length < 5) attachments.push(f); });
    renderAttach();
  } catch (e) { addMsg('ai', 'Ошибка загрузки: ' + e.message, true); }
  attachBtn.disabled = false; fileInput.value = '';
}
attachBtn.onclick = () => fileInput.click();
fileInput.onchange = () => uploadFiles(fileInput.files);
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth) dropzone.classList.add('on'); });
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('on'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; dropzone.classList.remove('on'); uploadFiles(e.dataTransfer.files); });

// ===== стрим-запрос =====
async function streamRequest(url, payload, contentEl) {
  abortCtrl = new AbortController();
  sendBtn.disabled = false; sendBtn.textContent = '⏹';
  let acc = '';
  try {
    const r = await fetch(url, { method: 'POST', signal: abortCtrl.signal,
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let lineBuf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      lineBuf += dec.decode(value, { stream: true });
      const lines = lineBuf.split('\n'); lineBuf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let j; try { j = JSON.parse(line); } catch (e) { continue; }
        if (j.err) { contentEl.innerHTML = md(acc || ''); addMsg('ai', '⚠️ ' + j.err, true); return acc; }
        if (j.d) { acc += j.d; contentEl.textContent = acc; chat.scrollTop = chat.scrollHeight; }
        if (j.done && j.model) modelInfo.textContent = j.model;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') { addMsg('ai', '⚠️ ' + e.message, true); return acc; }
  }
  return acc;
}
function endGen() { sendBtn.textContent = '➤'; abortCtrl = null; inp.focus(); }

async function send() {
  const text = inp.value.trim();
  if (!text && !attachments.length) return;
  const atts = attachments.filter(a => a.type !== 'error');
  const attNote = atts.map(a => a.type === 'image' ? `[🖼️ ${a.name}]` : `[📄 ${a.name}]`).join(' ');
  addMsg('user', (text + (attNote ? '\n' + attNote : '')).trim());
  inp.value = ''; inp.style.height = 'auto';
  attachments = []; renderAttach();
  sendBtn.disabled = true;
  const contentEl = addMsg('ai', 'печатает…');
  const acc = await streamRequest('/api/chat', { text, attachments: atts, stream: true }, contentEl);
  contentEl.innerHTML = acc ? md(acc) : '<i>(пусто)</i>';
  chat.scrollTop = chat.scrollHeight;
  endGen();
}

document.getElementById('regen-btn').onclick = async () => {
  if (abortCtrl) return;
  const aiMsgs = [...chat.querySelectorAll('.msg.ai')];
  if (!aiMsgs.length) return;
  aiMsgs[aiMsgs.length - 1].remove();
  const contentEl = addMsg('ai', 'печатает…');
  const acc = await streamRequest('/api/regenerate', { stream: true }, contentEl);
  contentEl.innerHTML = acc ? md(acc) : '<i>(пусто)</i>';
  chat.scrollTop = chat.scrollHeight;
  endGen();
};

sendBtn.onclick = () => abortCtrl ? abortCtrl.abort() : send();
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; });

// ===== модель =====
async function setModel(m, silent) {
  await fetch('/api/model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: m }) });
  modelInfo.textContent = silent ? m : m + ' ✓';
}
modelSelect.onchange = () => {
  if (modelSelect.value === 'custom') {
    const m = prompt('Вставь slug модели с openrouter.ai/models:', localStorage.myai_custom || '');
    if (!m) { modelSelect.value = localStorage.myai_model || 'openrouter/free'; return; }
    localStorage.myai_custom = m;
    if (![...modelSelect.options].some(o => o.value === m)) modelSelect.add(new Option(m, m));
    modelSelect.value = m; localStorage.myai_model = m; setModel(m);
  } else { localStorage.myai_model = modelSelect.value; setModel(modelSelect.value); }
};

// ===== экспорт =====
document.getElementById('export-btn').onclick = async () => {
  const d = await (await fetch('/api/config')).json();
  const mdText = (d.history || []).map(m => `**${m.role === 'user' ? 'Я' : 'MyAI'}:**\n\n${m.content}\n`).join('\n---\n\n');
  const blob = new Blob([`# MyAI — экспорт чата\n\n${mdText}`], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'myai-chat.md';
  a.click(); URL.revokeObjectURL(a.href);
};

// ===== голосовой ввод =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  micBtn.style.display = '';
  let rec = null, recording = false;
  micBtn.onclick = () => {
    if (recording) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = false;
    rec.onresult = e => { inp.value = (inp.value ? inp.value + ' ' : '') + e.results[0][0].transcript; inp.dispatchEvent(new Event('input')); };
    rec.onend = () => { recording = false; micBtn.classList.remove('on'); };
    rec.onerror = () => { recording = false; micBtn.classList.remove('on'); };
    recording = true; micBtn.classList.add('on'); rec.start();
  };
}

// ===== панель промпта =====
const panel = document.getElementById('prompt-panel');
const tempInput = document.getElementById('temp'), tempVal = document.getElementById('temp-val');
tempInput.oninput = () => tempVal.textContent = tempInput.value;
document.getElementById('prompt-btn').onclick = () => panel.classList.add('open');
document.getElementById('close-prompt').onclick = () => panel.classList.remove('open');
document.getElementById('save-prompt').onclick = async () => {
  await fetch('/api/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ systemPrompt: document.getElementById('prompt-text').value, temperature: parseFloat(tempInput.value) }) });
  panel.classList.remove('open');
};

document.getElementById('clear-btn').onclick = async () => {
  if (!confirm('Очистить всю историю диалога?')) return;
  await fetch('/api/clear', { method: 'POST' });
  chat.innerHTML = '';
};

// ===== инициализация =====
(async () => {
  const d = await (await fetch('/api/config')).json();
  modelInfo.textContent = d.model;
  document.getElementById('prompt-text').value = d.systemPrompt;
  if (d.temperature != null) { tempInput.value = d.temperature; tempVal.textContent = d.temperature; }
  if (!d.hasKey) addMsg('ai', '⚠️ Ключ API не задан. Перезапусти сервер так: set AI_API_KEY=sk-... && npm start', true);
  const saved = localStorage.myai_model;
  if (saved && [...modelSelect.options].some(o => o.value === saved)) modelSelect.value = saved;
  if (saved && saved !== d.model) setModel(saved, true);
  if (localStorage.myai_custom && ![...modelSelect.options].some(o => o.value === localStorage.myai_custom))
    modelSelect.add(new Option(localStorage.myai_custom, localStorage.myai_custom));
  (d.history || []).forEach(m => addMsg(m.role, m.content));
})();
</script>
</body>
</html>
