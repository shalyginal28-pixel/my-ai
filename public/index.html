<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080d">
<title>Aiva — AI Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#08080d;
  --sidebar:rgba(12,12,19,.88);
  --panel:rgba(255,255,255,.04);
  --panel2:rgba(255,255,255,.07);
  --hover:rgba(255,255,255,.06);
  --text:#f2f2f7;
  --muted:#9a9dab;
  --muted2:#61636e;
  --border:rgba(255,255,255,.08);
  --accent:#7c5cff;
  --accent2:#4f8cff;
  --danger:#ff6b6b;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
/* светящиеся пятна на фоне */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none;
}
body::before{width:560px;height:560px;top:-200px;left:32%;background:rgba(124,92,255,.13);animation:orb 16s ease-in-out infinite}
body::after{width:440px;height:440px;bottom:-180px;right:-100px;background:rgba(79,140,255,.10);animation:orb 20s ease-in-out infinite reverse}
@keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,40px)}}
button,input,textarea,select{font-family:inherit}
button{border:0;cursor:pointer;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(124,92,255,.5);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2b2d36;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

#app{position:relative;z-index:1;width:100%;height:100%;display:flex}

/* ============ SIDEBAR ============ */
#sidebar{
  width:272px;height:100%;flex-shrink:0;z-index:80;
  background:var(--sidebar);backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:14px 12px;
  transition:transform .28s cubic-bezier(.22,.61,.36,1);
}
.sidebar-top{display:flex;align-items:center;gap:10px;padding:4px 4px 16px}
.aiva-mark{
  width:36px;height:36px;border-radius:11px;position:relative;z-index:0;
  background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:0 8px 26px rgba(124,92,255,.30);
}
.aiva-mark::before{
  content:"";position:absolute;inset:-3px;border-radius:14px;z-index:-1;
  background:conic-gradient(from 0deg,transparent 65%,rgba(140,120,255,.9),transparent);
  animation:spin 4s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.aiva-name{font-size:16px;font-weight:800;letter-spacing:.2px}
.sidebar-close{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);display:none;font-size:20px}
.sidebar-close:hover{background:var(--hover);color:var(--text)}
.new-chat{
  width:100%;height:44px;border-radius:12px;background:var(--text);color:#0a0a10;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;
  transition:transform .15s,box-shadow .15s;
}
.new-chat:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,255,255,.12)}
.new-chat:active{transform:scale(.98)}
.history-title{color:var(--muted2);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding:20px 10px 8px;font-weight:700}
#history{flex:1;overflow-y:auto}
.history-item{
  width:100%;display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;margin-bottom:3px;
  color:var(--muted);text-align:left;font-size:13.5px;transition:.15s;position:relative;
}
.history-item::before{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;
  background:var(--grad);opacity:0;transition:.15s;
}
.history-item:hover{background:var(--hover);color:var(--text)}
.history-item.active{background:var(--panel2);color:var(--text)}
.history-item.active::before{opacity:1}
.history-icon{width:18px;flex-shrink:0;color:var(--muted2);font-size:12px}
.history-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:10px}
.sidebar-action{
  width:100%;min-height:42px;padding:8px 10px;border-radius:10px;color:var(--muted);
  display:flex;align-items:center;gap:11px;font-size:13.5px;text-align:left;transition:.15s;
}
.sidebar-action:hover{background:var(--hover);color:var(--text)}

/* ============ MAIN ============ */
#main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative}

header{
  height:62px;min-height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--border);
  background:rgba(8,8,13,.75);backdrop-filter:blur(20px);z-index:20;
}
.menu-btn{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:19px;display:none}
.menu-btn:hover{background:var(--panel);color:var(--text)}
.header-brand{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{
  width:35px;height:35px;border-radius:10px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:0 6px 20px rgba(124,92,255,.25);
}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:15px;font-weight:800}
.sub{font-size:10.5px;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.spacer{flex:1}
.header-actions{display:flex;align-items:center;gap:6px}

/* селект модели */
#model-select{
  appearance:none;-webkit-appearance:none;
  background-color:var(--panel);color:var(--muted);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 30px 8px 11px;font-size:12.5px;outline:none;cursor:pointer;max-width:230px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;
  background-size:5px 5px;background-repeat:no-repeat;
  transition:.15s;
}
#model-select:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
#model-select option{background:#14151c;color:var(--text)}

.ghost{height:36px;padding:0 10px;color:var(--muted);border-radius:9px;transition:.15s;display:flex;align-items:center;gap:6px}
.ghost:hover{background:var(--panel);color:var(--text)}
.icon-btn{width:36px;padding:0;justify-content:center;font-size:16px}
.legacy-tool-btn{display:none!important}

/* кнопка три точки */
#aiva-more-btn{width:36px;height:36px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.15s}
#aiva-more-btn:hover{background:var(--panel);color:var(--text)}
#aiva-more-btn.active{background:var(--panel);color:var(--text)}
#aiva-more-btn:active{transform:scale(.92)}
#aiva-more-btn svg{width:20px;height:20px}

/* панель инструментов */
#aiva-tools-overlay{
  position:fixed;inset:0;z-index:290;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;pointer-events:none;transition:.18s;
}
#aiva-tools-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
#aiva-tools-panel{
  position:fixed;top:0;right:0;bottom:0;width:300px;max-width:88vw;z-index:300;padding:16px 14px;
  background:linear-gradient(180deg,rgba(18,19,26,.98),rgba(12,13,18,.98));
  border-left:1px solid var(--border);box-shadow:-25px 0 70px rgba(0,0,0,.45);
  transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.61,.36,1);overflow-y:auto;
}
#aiva-tools-panel.open{transform:none}
.aiva-tools-head{min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px}
.aiva-tools-title{font-size:16px;font-weight:800}
#aiva-tools-close{width:34px;height:34px;border-radius:9px;color:var(--muted);font-size:24px;display:flex;align-items:center;justify-content:center;transition:.15s}
#aiva-tools-close:hover{background:var(--hover);color:var(--text)}
.aiva-tools-section-title{padding:0 6px 8px;color:var(--muted2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.aiva-tools-action{
  width:100%;min-height:46px;margin:2px 0;padding:0 12px;border-radius:11px;color:var(--muted);
  display:flex;align-items:center;gap:12px;text-align:left;font-size:13.5px;transition:.15s;
}
.aiva-tools-action:hover{background:var(--hover);color:var(--text)}
.aiva-tools-action:active{transform:scale(.985)}
.aiva-tools-icon{width:24px;min-width:24px;display:flex;align-items:center;justify-content:center;font-size:16px}
.aiva-tools-divider{height:1px;margin:14px 4px;background:var(--border)}

/* профиль */
.profile-wrap{position:relative;margin-left:4px;z-index:250}
.profile-btn{
  width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;
  border:2px solid rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(124,92,255,.28);transition:.18s;
}
.profile-btn:hover{transform:scale(1.07);border-color:rgba(255,255,255,.25)}
.profile-menu{
  position:absolute;top:46px;right:0;width:292px;
  background:linear-gradient(180deg,rgba(22,23,31,.98),rgba(15,16,21,.98));
  border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:9px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);backdrop-filter:blur(24px);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(-7px) scale(.97);transform-origin:top right;transition:.16s;
}
.profile-menu.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.profile-head{display:flex;align-items:center;gap:12px;padding:11px}
.profile-avatar-large{
  width:44px;height:44px;flex-shrink:0;border-radius:13px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  box-shadow:0 7px 20px rgba(124,92,255,.25);
}
.profile-info{min-width:0;flex:1}
.profile-email{color:var(--text);font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-user-id{color:var(--muted2);font-size:10px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-plan{
  width:100%;min-height:56px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,rgba(124,92,255,.13),rgba(79,140,255,.07));
  border:1px solid rgba(124,92,255,.16);border-radius:12px;cursor:pointer;transition:.16s;
}
.profile-plan:hover{background:linear-gradient(135deg,rgba(124,92,255,.19),rgba(79,140,255,.11));border-color:rgba(124,92,255,.3)}
.profile-plan-left{display:flex;align-items:center;gap:10px}
.profile-plan-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.17);color:#b3a8ff;font-size:15px}
.profile-plan-title{color:#b3a8ff;font-size:11px;font-weight:800;letter-spacing:.05em}
.profile-plan-subtitle{color:var(--muted2);font-size:10px;margin-top:2px}
.profile-plan-arrow{color:var(--muted2);font-size:20px}
.profile-divider{height:1px;background:var(--border);margin:7px 4px}
.profile-item{width:100%;height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:10px;color:var(--muted);text-align:left;font-size:13px;transition:.15s}
.profile-item:hover{background:var(--hover);color:var(--text)}
.profile-item-icon{width:20px;text-align:center;font-size:14px}
.profile-item-text{flex:1}
.profile-item-arrow{color:var(--muted2);font-size:16px}
.profile-item.logout{color:#ff8080}
.profile-item.logout:hover{background:rgba(255,80,80,.09);color:#ff9c9c}

/* ============ ЧАТ ============ */
#chat{flex:1;overflow-y:auto;padding:26px 20px 180px;scroll-behavior:smooth}
.chat-inner{width:100%;max-width:840px;margin:0 auto}

#welcome{
  min-height:calc(100vh - 250px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:35px 15px;
}
.welcome-logo{
  width:76px;height:76px;border-radius:24px;position:relative;z-index:0;
  background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;
  margin-bottom:24px;box-shadow:0 18px 60px rgba(100,90,255,.28);
  animation:float 4s ease-in-out infinite;
}
.welcome-logo::before{
  content:"";position:absolute;inset:-5px;border-radius:29px;z-index:-1;
  background:conic-gradient(from 0deg,transparent 62%,rgba(150,130,255,.85),transparent);
  animation:spin 5s linear infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#welcome h2{font-size:30px;font-weight:750;letter-spacing:-.7px;margin-bottom:8px}
#welcome p{color:var(--muted);font-size:14px;margin-bottom:30px}
.quick-actions{width:100%;max-width:680px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));
  border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--text);text-align:left;
  transition:.18s;position:relative;overflow:hidden;
}
.quick-card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(320px 120px at var(--mx,50%) var(--my,0%),rgba(124,92,255,.10),transparent 70%);
  opacity:0;transition:.2s;pointer-events:none;
}
.quick-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-2px);box-shadow:0 12px 35px rgba(0,0,0,.22)}
.quick-card:hover::after{opacity:1}
.quick-icon{
  width:34px;height:34px;border-radius:10px;background:rgba(124,92,255,.13);
  display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px;
}
.quick-title{font-size:13.5px;font-weight:650;margin-bottom:3px}
.quick-description{color:var(--muted2);font-size:11.5px}

/* сообщения */
.msg{display:flex;gap:11px;margin-bottom:24px;animation:msgIn .22s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .ava{
  width:30px;height:30px;flex-shrink:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.msg.ai .ava{background:var(--grad);box-shadow:0 6px 18px rgba(124,92,255,.18);color:#fff}
.msg.me{flex-direction:row-reverse}
.msg.me .ava{background:#24262e;color:var(--muted)}
.msg>div:nth-child(2){min-width:0;max-width:78%}
.content{
  font-size:15px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;
  background:transparent;border:0;padding:1px 0;
}
.msg.me .content{
  background:linear-gradient(180deg,rgba(124,92,255,.13),rgba(79,140,255,.08));
  border:1px solid rgba(124,92,255,.18);padding:10px 14px;border-radius:16px;line-height:1.5;
}
.content p{margin:7px 0}
.content p:first-child{margin-top:0}
.content p:last-child{margin-bottom:0}
.content pre{background:#06070a;border:1px solid var(--border);border-radius:11px;padding:13px;overflow-x:auto;margin:12px 0}
.content code{font-family:Consolas,monospace;font-size:13px}
.content>code{background:rgba(255,255,255,.07);border-radius:5px;padding:2px 5px}
.msg.error .content{color:#ff9090}

/* статус «думает» */
.thinking-box{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;min-height:26px}
.thinking-orb{
  width:22px;height:22px;border-radius:50%;position:relative;flex-shrink:0;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));
  animation:spin 1.1s linear infinite;
}
.thinking-orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0b0b12}
.thinking-dots{display:inline-flex;gap:3px;margin-left:3px}
.thinking-dots span{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.3;animation:dot 1.1s infinite ease-in-out}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,70%,100%{opacity:.24;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}

/* тулбар сообщения */
.toolbar{display:flex;gap:2px;margin-top:7px;opacity:0;transition:.15s}
.msg.ai:hover .toolbar{opacity:1}
.toolbar button{
  min-width:30px;height:28px;padding:0 7px;color:var(--muted2);border-radius:7px;font-size:12.5px;transition:.13s;
}
.toolbar button:hover{background:var(--panel);color:var(--text)}
.toolbar button:active{transform:scale(.92)}
.toolbar button.active{color:#b3a8ff;background:rgba(124,92,255,.10)}

/* ============ ВВОД ============ */
#inputbar{
  position:absolute;left:0;right:0;bottom:0;z-index:15;
  padding:10px max(20px,calc((100vw - 840px)/2)) 18px;
  background:linear-gradient(to top,var(--bg) 65%,transparent);
}
#attachbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{
  display:flex;align-items:center;gap:6px;background:rgba(21,22,29,.9);
  border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:12px;max-width:260px;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{color:var(--muted);padding:0 2px;font-size:13px}
.chip button:hover{color:#ff9090}
.chip.err{color:#ff9090;border-color:rgba(255,80,80,.3)}
#inputrow{
  display:flex;align-items:flex-end;gap:7px;max-width:840px;margin:0 auto;padding:8px;
  background:rgba(21,22,29,.92);border:1px solid rgba(255,255,255,.09);border-radius:18px;
  box-shadow:0 12px 44px rgba(0,0,0,.32);backdrop-filter:blur(18px);
  transition:border-color .16s,box-shadow .16s;
}
#inputrow:focus-within{
  border-color:rgba(124,92,255,.35);
  box-shadow:0 12px 44px rgba(0,0,0,.32),0 0 0 3px rgba(124,92,255,.07);
}
.round{width:38px;height:38px;flex-shrink:0;color:var(--muted);border-radius:11px;font-size:18px;transition:.14s}
.round:hover{background:var(--hover);color:var(--text)}
.round:active{transform:scale(.92)}
.round.on{color:#ff5252;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#inp{
  flex:1;min-height:38px;max-height:160px;background:transparent;border:0;outline:0;resize:none;
  color:var(--text);font-size:15px;line-height:1.45;padding:9px 3px;
}
#inp::placeholder{color:var(--muted2)}
#send{
  width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--text);color:#0a0a10;font-size:17px;
  transition:transform .14s,background .14s,color .14s,opacity .14s;
}
#send:hover{transform:scale(1.05)}
#send:active{transform:scale(.96)}
#send.stop{background:#25272e;color:#fff}
#send:disabled{opacity:.55;cursor:wait}

/* dropzone */
#dropzone{
  display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;
  background:rgba(8,8,14,.85);backdrop-filter:blur(10px);color:#fff;font-size:21px;
}
#dropzone.on{display:flex}

/* панель промпта */
#prompt-panel{
  position:fixed;top:0;right:0;bottom:0;width:370px;max-width:92vw;z-index:310;
  background:#111218;border-left:1px solid var(--border);padding:22px;
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;gap:12px;box-shadow:-20px 0 60px rgba(0,0,0,.3);
}
#prompt-panel.open{transform:none}
#prompt-panel h3{font-size:16px}
#prompt-text{
  flex:1;background:#0a0a10;border:1px solid var(--border);border-radius:12px;color:var(--text);
  padding:13px;font-size:14px;resize:none;outline:none;
}
#prompt-text:focus{border-color:rgba(124,92,255,.4)}
.slider-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.slider-row input{flex:1;accent-color:var(--accent)}
.slider-row b{color:var(--text)}
.save-btn{height:42px;border-radius:11px;background:var(--text);color:#0a0a10;font-weight:700;transition:.15s}
.save-btn:hover{transform:translateY(-1px)}

/* toast */
#aiva-toast{
  position:fixed;left:50%;bottom:26px;z-index:100000;
  transform:translate(-50%,10px);
  background:rgba(22,23,31,.96);border:1px solid rgba(255,255,255,.1);color:var(--text);

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://gzphouchibqjxwudncdz.supabase.co";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = supabaseClient;

/* ================= PROFILE ================= */
const profileBtn = document.getElementById("profile-btn");

function getUserInitial(email){
  return (String(email || "A").trim().charAt(0) || "A").toUpperCase();
}
function shortUserId(id){
  return id ? String(id).slice(0,8) + "..." : "—";
}
function updateProfile(user){
  if(!user){
    profileEmail.textContent = "Не авторизован";
    profileUserId.textContent = "—";
    profileBtn.textContent = "A";
    profileAvatarLarge.textContent = "A";
    return;
  }
  const email = user.email || "Пользователь Aiva";
  const initial = getUserInitial(email);
  profileEmail.textContent = email;
  profileUserId.textContent = shortUserId(user.id);
  profileBtn.textContent = initial;
  profileAvatarLarge.textContent = initial;
}
function openProfileMenu(){
  closeToolsPanel();
  profileMenu.classList.add("open");
  profileBtn.setAttribute("aria-expanded","true");
}
function closeProfileMenu(){
  profileMenu.classList.remove("open");
  profileBtn.setAttribute("aria-expanded","false");
}
profileBtn.addEventListener("click", e => {
  e.stopPropagation();
  profileMenu.classList.contains("open") ? closeProfileMenu() : openProfileMenu();
});
document.addEventListener("click", e => {
  if(!profileWrap.contains(e.target)) closeProfileMenu();
});

/* logout */
async function logout(){
  closeProfileMenu();
  logoutBtn.disabled = true;
  try{
    const { error } = await supabaseClient.auth.signOut();
    if(error){
      alert("Не удалось выйти из аккаунта.");
      return;
    }
    activeChatId = null; chats = [];
    try{ localStorage.removeItem(HISTORY_KEY); }catch(e){}
    chatInner.innerHTML = "";
    showAuthScreen();
  }catch(e){
    alert("Ошибка выхода из аккаунта.");
  }finally{
    logoutBtn.disabled = false;
  }
}
logoutBtn.addEventListener("click", logout);

profileSettings.addEventListener("click", async () => {
  closeProfileMenu();
  const { data } = await supabaseClient.auth.getUser();
  const user = data?.user;
  if(!user){ alert("Пользователь не авторизован."); return; }
  alert("Настройки Aiva\n\nEmail: " + (user.email || "—") + "\n\nID: " + (user.id || "—") + "\n\nТариф: FREE");
});

}

profileSubscription.addEventListener("click", showSubscription);

/* ================= AUTH ================= */
const authScreen = document.getElementById("authScreen");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authSwitch = document.getElementById("authSwitch");
const googleAuth = document.getElementById("googleAuth");
const authTitle = document.getElementById("authTitle");
const authError = document.getElementById("authError");
let isSignup = false;

function showAuthError(m){ authError.textContent = m || ""; authError.classList.remove("success"); }
function showAuthSuccess(m){ authError.textContent = m || ""; authError.classList.add("success"); }
function hideAuthScreen(){ authScreen.classList.add("hidden"); }
function showAuthScreen(){
  closeProfileMenu(); closeToolsPanel();
  authScreen.classList.remove("hidden");
}
function updateAuthMode(){
  authTitle.textContent = isSignup ? "Создать аккаунт Aiva" : "Войти в Aiva";
  authSubmit.textContent = isSignup ? "Создать аккаунт" : "Войти";
  authSwitch.textContent = isSignup ? "У меня уже есть аккаунт" : "Создать аккаунт";
  authPassword.autocomplete = isSignup ? "new-password" : "current-password";
  showAuthError("");
}

async function checkAuth(){
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data.session){
      updateProfile(data.session.user);
      hideAuthScreen();
    }else{
      updateProfile(null);
      showAuthScreen();
    }
    return data.session || null;
  }catch(e){
    updateProfile(null);
    showAuthScreen();
    return null;
  }
}
const authReady = checkAuth();

async function apiFetch(url, options = {}){
  const { data: { session } } = await supabaseClient.auth.getSession();
  const headers = new Headers(options.headers || {});
  if(session?.access_token) headers.set("Authorization", `Bearer ${session.access_token}`);
  return fetch(url, { ...options, headers });
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if(session){ updateProfile(session.user); hideAuthScreen(); }
  else{ updateProfile(null); showAuthScreen(); }
});

authSwitch.addEventListener("click", () => { isSignup = !isSignup; updateAuthMode(); });

authSubmit.addEventListener("click", async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if(!email) return showAuthError("Введите email");
  if(!password) return showAuthError("Введите пароль");
  if(password.length < 6) return showAuthError("Пароль должен содержать минимум 6 символов");
  authSubmit.disabled = true;
  showAuthError("");
  try{
    let result;
    if(isSignup) result = await supabaseClient.auth.signUp({ email, password });
    else result = await supabaseClient.auth.signInWithPassword({ email, password });
    if(result.error) return showAuthError(result.error.message);
    if(isSignup && !result.data.session){
      return showAuthSuccess("Аккаунт создан. Проверьте почту для подтверждения.");
    }
    if(result.data.user) updateProfile(result.data.user);
    hideAuthScreen();
  }catch(e){
    showAuthError("Произошла ошибка. Попробуйте ещё раз.");
  }finally{
    authSubmit.disabled = false;
  }
});

googleAuth.addEventListener("click", async () => {
  showAuthError("");
  try{
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin }
    });
    if(error) showAuthError(error.message);
  }catch(e){
    showAuthError("Не удалось открыть Google. Попробуйте ещё раз.");
  }
});

function showToast(message){
  toastEl.textContent = message || "";
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);

/* ================= TOOLS PANEL ================= */
function openToolsPanel(){
  closeProfileMenu();
  aivaToolsPanel.classList.add("open");
  aivaToolsOverlay.classList.add("open");
  aivaMoreBtn.classList.add("active");
  aivaMoreBtn.setAttribute("aria-expanded","true");
  aivaToolsPanel.setAttribute("aria-hidden","false");
  aivaToolsOverlay.setAttribute("aria-hidden","false");
}

  aivaToolsPanel.classList.remove("open");
  aivaToolsOverlay.classList.remove("open");

  aivaMoreBtn.setAttribute("aria-expanded","false");
  aivaToolsPanel.setAttribute("aria-hidden","true");
  aivaToolsOverlay.setAttribute("aria-hidden","true");
}
function toggleToolsPanel(){
  aivaToolsPanel.classList.contains("open") ? closeToolsPanel() : openToolsPanel();
}
aivaMoreBtn.addEventListener("click", e => { e.stopPropagation(); toggleToolsPanel(); });
aivaToolsClose.addEventListener("click", closeToolsPanel);
aivaToolsOverlay.addEventListener("click", closeToolsPanel);

/* ================= CHATS (localStorage) ================= */
let attachments = [];
let abortCtrl = null;
const HISTORY_KEY = "aiva_chat_history_v1";
let chats = [];
let activeChatId = null;

function loadChats(){
  try{
    chats = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    if(!Array.isArray(chats)) chats = [];
  }catch(e){ chats = []; }
}
function saveChats(){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(chats)); }catch(e){}
}
function createChat(){
  const chatData = {
    id: Date.now().toString(),
    title: "Новый чат",
    messages: [],
    created: Date.now()
  };
  chats.unshift(chatData);
  activeChatId = chatData.id;
  saveChats();
  renderHistory();
}
function getActiveChat(){
  return chats.find(c => c.id === activeChatId);
}
function makeTitle(text){
  const clean = String(text).replace(/\s+/g," ").trim();
  if(!clean) return "Новый чат";
  return clean.length > 38 ? clean.slice(0,38) + "…" : clean;
}
function saveCurrentMessages(){

    const role = m.classList.contains("me") ? "user" : "assistant";

  });
  const firstUser = current.messages.find(m => m.role === "user");
  if(firstUser) current.title = makeTitle(firstUser.content);
  saveChats();
  renderHistory();
}

/* ================= MARKDOWN ================= */
function md(t){
  let h = String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => "<pre><code>" + c.replace(/^\n|\n$/g,"") + "</code></pre>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/^###+ (.*)$/gm,"<b>$1</b>").replace(/^## (.*)$/gm,"<b>$1</b>").replace(/^# (.*)$/gm,"<b>$1</b>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.split(/\n{2,}/).map(p => /^<pre>/.test(p.trim()) ? p : "<p>" + p.replace(/\n/g,"<br>") + "</p>").join("");
  return h;
}

/* ================= VOICE OUTPUT ================= */
function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const lines = String(text).replace(/[#*`>\-]/g," ").split("\n").filter(x => x.trim()).slice(0,12);
  const u = new SpeechSynthesisUtterance(lines.join(". ").slice(0,1200));
  u.lang = "ru-RU"; u.rate = 1.05;
  speechSynthesis.speak(u);
}

/* ================= THINKING ================= */
function setThinkingStatus(contentEl, text){
  contentEl.innerHTML = `
    <span class="thinking-box" aria-live="polite">
      <span class="thinking-orb"></span>
      <span>${text}<span class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span></span>
    </span>`;
}
function startThinking(contentEl, statuses){
  let index = 0;
  setThinkingStatus(contentEl, statuses[index]);
  return setInterval(() => {
    index = (index + 1) % statuses.length;
    setThinkingStatus(contentEl, statuses[index]);
  }, 1300);
}

/* ================= MESSAGES ================= */
function addMsg(role, text, error=false, silent=false){
  const oldWelcome = document.getElementById("welcome");
  if(oldWelcome) oldWelcome.remove();

  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "ai") + (error ? " error" : "");

  const ava = document.createElement("div");
  ava.className = "ava";
  ava.textContent = role === "user" ? "●" : "✦";

  const wrap = document.createElement("div");
  const c = document.createElement("div");
  c.className = "content";
  if(error) c.textContent = text; else c.innerHTML = md(text);
  wrap.appendChild(c);

  if(!error && role !== "user"){
    const tb = document.createElement("div");
    tb.className = "toolbar";

    const mk = (icon, title, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = icon; b.title = title;
      b.onclick = fn; return b;
    };

    const bCopy = mk("📋","Скопировать", () =>
      navigator.clipboard.writeText(text)
        .then(() => showToast("Скопировано"))
        .catch(() => showToast("Не удалось скопировать"))
    );

    const bSpeak = mk("🔊","Озвучить", () => {
      if(window.speechSynthesis && speechSynthesis.speaking){
        speechSynthesis.cancel();
        showToast("Озвучивание остановлено");
      }else{
        speak(text);
        showToast("Озвучивание запущено");
      }
    });

    const bLike = mk("👍","Хороший ответ", () => {
      bLike.classList.toggle("active");
      bDislike.classList.remove("active");
      showToast(bLike.classList.contains("active") ? "Спасибо за отзыв" : "Отзыв отменён");
    });

    const bDislike = mk("👎","Плохой ответ", () => {
      bDislike.classList.toggle("active");
      bLike.classList.remove("active");
      showToast(bDislike.classList.contains("active") ? "Спасибо за отзыв" : "Отзыв отменён");
    });

    const bRegen = mk("↻","Перегенерировать", () => {
      document.getElementById("regen-btn").click();
    });

    tb.append(bCopy, bSpeak, bLike, bDislike, bRegen);
    wrap.appendChild(tb);
  }

  d.append(ava, wrap);
  chatInner.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(!silent) saveCurrentMessages();
  return c;
}

function renderAttach(){
  attachBar.innerHTML = "";
  attachments.forEach((a,i) => {
    const c = document.createElement("div");
    c.className = "chip" + (a.type === "error" ? " err" : "");
    const icon = a.type === "image" ? "🖼️" : a.type === "error" ? "⚠️" : "📄";
    const info = a.type === "error" ? a.error
      : a.type === "image" ? ((a.size / 1024 | 0) + " КБ")
      : a.size + " симв.";
    const span = document.createElement("span");
    span.textContent = `${a.name} · ${info}`;
    span.title = a.name;
    c.append(document.createTextNode(icon), span);
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕";
    x.onclick = () => { attachments.splice(i,1); renderAttach(); };
    c.appendChild(x);
    attachBar.appendChild(c);
  });
}

async function uploadFiles(files){
  if(!files.length) return;
  const fd = new FormData();
  [...files].slice(0,5).forEach(f => fd.append("files", f));
  attachBtn.disabled = true;
  showToast("Загружаю файл…");
  try{
    const r = await apiFetch("/api/upload", { method: "POST", body: fd });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "Ошибка загрузки");
    (d.files || []).forEach(f => { if(attachments.length < 5) attachments.push(f); });
    renderAttach();
    showToast("Файл готов");
  }catch(e){
    addMsg("ai", "Ошибка загрузки: " + e.message, true);
  }
  attachBtn.disabled = false;
  fileInput.value = "";
}

let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; dropzone.classList.add("on"); });
window.addEventListener("dragleave", e => {
  e.preventDefault(); dragDepth--;
  if(dragDepth <= 0){ dragDepth = 0; dropzone.classList.remove("on"); }
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  dropzone.classList.remove("on");

});

/* ================= STREAM ================= */
async function streamRequest(url, payload, contentEl){

  abortCtrl = new AbortController();

  sendBtn.disabled = false;
  sendBtn.textContent = "■";
  sendBtn.classList.add("stop");

  let acc = "";

  try{

    /*
      Отправляем обычный JSON-ответ.
      Backend server.js это поддерживает:
      { ok:true, reply:"...", model:"..." }

      Это убирает проблему браузерного
      "Failed to fetch" из-за NDJSON/стриминга.
    */

    const r = await apiFetch(
      url,
      {
        method: "POST",

        signal: abortCtrl.signal,

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          ...payload,
          stream: false
        })
      }
    );


    let data = null;

    try{

      data = await r.json();

    }catch(e){

      data = null;

    }


    if(!r.ok){

      throw new Error(
        data?.error ||
        "HTTP " + r.status
      );

    }


    if(!data){

      throw new Error(
        "Сервер вернул пустой ответ"
      );

    }


    if(data.ok === false){

      throw new Error(
        data.error ||
        "Сервер не смог обработать запрос"
      );

    }


    acc = String(
      data.reply ||
      ""
    );


    if(data.model){

      modelInfo.textContent =
        data.model;

    }


    contentEl.textContent =
      acc;


    chat.scrollTop =
      chat.scrollHeight;


    return acc;


  }catch(e){

    if(
      e.name === "AbortError"
    ){

      return acc;

    }


    console.error(
      "Aiva chat error:",
      e
    );


    contentEl.textContent =
      "";


    addMsg(
      "ai",
      "⚠️ " +
      (
        e.message ||
        "Не удалось получить ответ от сервера"
      ),
      true
    );


    return acc;

  }

}

/* ================= SEND ================= */
async function send(){
  const text = inp.value.trim();
  if(!text && !attachments.length) return;
  if(!activeChatId) createChat();

  const atts = attachments.filter(a => a.type !== "error");
  const attNote = atts.map(a => a.type === "image" ? `[🖼️ ${a.name}]` : `[📄 ${a.name}]`).join(" ");

  addMsg("user", (text + (attNote ? "\n" + attNote : "")).trim());
  inp.value = ""; inp.style.height = "auto";
  attachments = []; renderAttach();
  sendBtn.disabled = true;

  const contentEl = addMsg("ai", "");
  const statuses = atts.length
    ? ["Размышляет","Просматривает файл","Анализирует данные","Формирует ответ"]
    : ["Размышляет","Анализирует запрос","Подбирает ответ","Формирует ответ"];
  const thinkingTimer = startThinking(contentEl, statuses);

  const acc = await streamRequest("/api/chat", { text, attachments: atts, stream: true }, contentEl);

  clearInterval(thinkingTimer);
  contentEl.innerHTML = acc ? md(acc) : "<i>(пусто)</i>";
  chat.scrollTop = chat.scrollHeight;
  saveCurrentMessages();
  endGen();
}

sendBtn.onclick = () => abortCtrl ? abortCtrl.abort() : send();
inp.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 160) + "px";
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  micBtn.style.display = "";
  let rec = null, recording = false;
  micBtn.onclick = () => {
    if(recording){ rec.stop(); return; }
    rec = new SR();
    rec.lang = "ru-RU";
    rec.interimResults = false;
    rec.onresult = e => {
      inp.value = (inp.value ? inp.value + " " : "") + e.results[0][0].transcript;
      inp.dispatchEvent(new Event("input"));
    };
    rec.onend = () => { recording = false; micBtn.classList.remove("on"); };
    rec.onerror = () => { recording = false; micBtn.classList.remove("on"); };
    recording = true;
    micBtn.classList.add("on");
    rec.start();
  };
}

    method: "POST",

  });
  modelInfo.textContent = silent ? m : m + " ✓";

  if(modelSelect.value === "custom"){
    const m = prompt("Вставь slug модели с openrouter.ai/models:", localStorage.aiva_custom || "");
    if(!m){ modelSelect.value = localStorage.aiva_model || "openrouter/free"; return; }
    localStorage.aiva_custom = m;
    if(![...modelSelect.options].some(o => o.value === m)) modelSelect.add(new Option(m, m));
    modelSelect.value = m;
    localStorage.aiva_model = m;
    setModel(m);
  }else{
    localStorage.aiva_model = modelSelect.value;
    setModel(modelSelect.value);
  }
};

(async () => {

  loadChats();
  if(!chats.length) createChat();
  else activeChatId = chats[0].id;
  renderHistory();

  try{
    const r = await apiFetch("/api/config");

    if(!r.ok) throw new Error(d.error || "HTTP " + r.status);

    modelInfo.textContent = d.model || "Твой AI-ассистент";
    document.getElementById("prompt-text").value = d.systemPrompt || "";
    if(d.temperature != null){ tempInput.value = d.temperature; tempVal.textContent = d.temperature; }

    /* восстановление выбранной модели */
    const saved = localStorage.aiva_model;
    if(saved){
      if(![...modelSelect.options].some(o => o.value === saved)) modelSelect.add(new Option(saved, saved));
      modelSelect.value = saved;
      if(saved !== d.model) setModel(saved, true);
    }
    if(localStorage.aiva_custom && ![...modelSelect.options].some(o => o.value === localStorage.aiva_custom))
      modelSelect.add(new Option(localStorage.aiva_custom, localStorage.aiva_custom));

    if(!d.hasKey) addMsg("ai", "⚠️ Ключ API не задан. Перезапусти сервер с AI_API_KEY.", true);

    const current = getActiveChat();
    if(current && current.messages.length) openChat(current.id);
    else showWelcome();
  }catch(e){
    showWelcome();
    const { data } = await supabaseClient.auth.getSession();
    if(data.session) addMsg("ai", "Не удалось загрузить конфигурацию: " + e.message, true);
  }
})();
