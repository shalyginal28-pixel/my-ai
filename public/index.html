<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080d">
<title>Aiva — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08080d;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.07);--hover:rgba(255,255,255,.06);--text:#f2f2f7;--muted:#9a9dab;--muted2:#80838f;--border:rgba(255,255,255,.09);--accent:#7c5cff;--accent2:#4f8cff;--pink:#c86bff;--grad:linear-gradient(135deg,var(--accent),var(--accent2));--grad3:linear-gradient(135deg,var(--accent),var(--pink),var(--accent2));--ease:cubic-bezier(.22,.61,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,Inter,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none}
body::before{width:560px;height:560px;top:-200px;left:32%;background:rgba(124,92,255,.13)}
body::after{width:440px;height:440px;bottom:-180px;right:-100px;background:rgba(79,140,255,.1)}
button,input,textarea,select{font-family:inherit;touch-action:manipulation}
button{border:0;cursor:pointer;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(124,92,255,.5);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2b2d36;border-radius:10px}
::selection{background:rgba(124,92,255,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app{position:relative;z-index:1;width:100%;height:100%;height:var(--app-h,100dvh);display:flex}
.grad-text{background:var(--grad3);-webkit-background-clip:text;background-clip:text;color:transparent}

/ сайдбар /
#sidebar{width:272px;height:100%;flex-shrink:0;z-index:80;background:rgba(12,12,19,.94);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;transition:transform .28s var(--ease)}
.sb-top{display:flex;align-items:center;gap:10px;padding:4px 4px 16px}
.mark{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;box-shadow:0 8px 26px rgba(124,92,255,.3)}
.name{font-size:16px;font-weight:800}
#sb-close{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);display:none;font-size:22px}
.new-chat{width:100%;height:46px;border-radius:12px;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.35);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.new-chat:hover{background:rgba(124,92,255,.22)}
.h-title{color:var(--muted2);font-size:12px;letter-spacing:.04em;padding:20px 10px 8px;font-weight:700}
#history{flex:1;overflow-y:auto}
.h-item{width:100%;display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:3px;color:var(--muted);text-align:left;font-size:14px;transition:.15s;position:relative}
.h-item::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--grad);opacity:0;transition:.15s}
.h-item:hover{background:var(--hover);color:var(--text)}
.h-item.active{background:var(--panel2);color:var(--text)}.h-item.active::before{opacity:1}
.h-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.h-act{display:none;gap:2px;flex-shrink:0}.h-item:hover .h-act{display:flex}
@media(pointer:coarse){.h-act{display:flex}}
.ha{width:26px;height:26px;border-radius:7px;color:var(--muted2);font-size:13px;display:flex;align-items:center;justify-content:center}
.ha:hover{background:rgba(255,255,255,.08);color:var(--text)}.ha.del:hover{color:#ff8080}
.sb-bottom{border-top:1px solid var(--border);padding-top:10px}
.sb-act{width:100%;min-height:42px;padding:8px 10px;border-radius:10px;color:var(--muted);display:flex;align-items:center;gap:11px;font-size:14px;text-align:left}
.sb-act:hover{background:var(--hover);color:var(--text)}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:70}#sb-overlay.on{display:block}

/ шапка /
#main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative}
header{height:60px;min-height:60px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(8,8,13,.75);backdrop-filter:blur(20px);z-index:20}
.icon{width:38px;height:38px;flex-shrink:0;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.icon:hover{background:var(--panel);color:var(--text)}
#menu-btn{display:none}
.brand{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .mark{width:30px;height:30px;border-radius:9px;font-size:14px;box-shadow:none}
.spacer{flex:1}
#model-select{appearance:none;-webkit-appearance:none;background-color:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:8px 30px 8px 12px;font-size:13px;outline:none;cursor:pointer;max-width:240px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
#model-select:hover{color:var(--text)}#model-select option{background:#14151c;color:var(--text)}
.wrap{position:relative}
.profile-btn{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:.18s}
.pop{position:absolute;top:46px;right:0;width:272px;z-index:250;background:#14151c;border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:8px;box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s}
.pop.open{opacity:1;visibility:visible;transform:none}
.pi{width:100%;height:44px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;color:var(--muted);font-size:14px;text-align:left}
.pi:hover{background:var(--hover);color:var(--text)}.pi.red{color:#ff8080}
