<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080d">
<title>Aiva — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08080d;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.07);--hover:rgba(255,255,255,.06);--text:#f2f2f7;--muted:#9a9dab;--muted2:#80838f;--border:rgba(255,255,255,.09);--accent:#7c5cff;--accent2:#4f8cff;--pink:#c86bff;--grad:linear-gradient(135deg,var(--accent),var(--accent2));--grad3:linear-gradient(135deg,var(--accent),var(--pink),var(--accent2));--ease:cubic-bezier(.22,.61,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,Inter,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none}
body::before{width:560px;height:560px;top:-200px;left:32%;background:rgba(124,92,255,.13)}
body::after{width:440px;height:440px;bottom:-180px;right:-100px;background:rgba(79,140,255,.1)}
button,input,textarea,select{font-family:inherit;touch-action:manipulation}
button{border:0;cursor:pointer;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(124,92,255,.5);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2b2d36;border-radius:10px}
::selection{background:rgba(124,92,255,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app{position:relative;z-index:1;width:100%;height:100%;height:var(--app-h,100dvh);display:flex}
.grad-text{background:var(--grad3);-webkit-background-clip:text;background-clip:text;color:transparent}

/* сайдбар */
#sidebar{width:272px;height:100%;flex-shrink:0;z-index:80;background:rgba(12,12,19,.94);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;transition:transform .28s var(--ease)}
.sb-top{display:flex;align-items:center;gap:10px;padding:4px 4px 16px}
.mark{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;box-shadow:0 8px 26px rgba(124,92,255,.3)}
.name{font-size:16px;font-weight:800}
#sb-close{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);display:none;font-size:22px}
.new-chat{width:100%;height:46px;border-radius:12px;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.35);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.new-chat:hover{background:rgba(124,92,255,.22)}
.h-title{color:var(--muted2);font-size:12px;letter-spacing:.04em;padding:20px 10px 8px;font-weight:700}
#history{flex:1;overflow-y:auto}
.h-item{width:100%;display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:3px;color:var(--muted);text-align:left;font-size:14px;transition:.15s;position:relative}
.h-item::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--grad);opacity:0;transition:.15s}
.h-item:hover{background:var(--hover);color:var(--text)}
.h-item.active{background:var(--panel2);color:var(--text)}.h-item.active::before{opacity:1}
.h-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.h-act{display:none;gap:2px;flex-shrink:0}.h-item:hover .h-act{display:flex}
@media(pointer:coarse){.h-act{display:flex}}
.ha{width:26px;height:26px;border-radius:7px;color:var(--muted2);font-size:13px;display:flex;align-items:center;justify-content:center}
.ha:hover{background:rgba(255,255,255,.08);color:var(--text)}.ha.del:hover{color:#ff8080}
.sb-bottom{border-top:1px solid var(--border);padding-top:10px}
.sb-act{width:100%;min-height:42px;padding:8px 10px;border-radius:10px;color:var(--muted);display:flex;align-items:center;gap:11px;font-size:14px;text-align:left}
.sb-act:hover{background:var(--hover);color:var(--text)}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:70}#sb-overlay.on{display:block}

/* шапка */
#main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative}
header{height:60px;min-height:60px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(8,8,13,.75);backdrop-filter:blur(20px);z-index:20}
.icon{width:38px;height:38px;flex-shrink:0;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.icon:hover{background:var(--panel);color:var(--text)}
#menu-btn{display:none}
.brand{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .mark{width:30px;height:30px;border-radius:9px;font-size:14px;box-shadow:none}
.spacer{flex:1}
#model-select{appearance:none;-webkit-appearance:none;background-color:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:8px 30px 8px 12px;font-size:13px;outline:none;cursor:pointer;max-width:240px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
#model-select:hover{color:var(--text)}#model-select option{background:#14151c;color:var(--text)}
.wrap{position:relative}
.profile-btn{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:.18s}
.pop{position:absolute;top:46px;right:0;width:272px;z-index:250;background:#14151c;border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:8px;box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s}
.pop.open{opacity:1;visibility:visible;transform:none}
.pi{width:100%;height:44px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;color:var(--muted);font-size:14px;text-align:left}
.pi:hover{background:var(--hover);color:var(--text)}.pi.red{color:#ff8080}
.pi span:first-child{width:20px;text-align:center}
.pdiv{height:1px;background:var(--border);margin:6px 4px}
.p-head{display:flex;align-items:center;gap:12px;padding:10px}
.p-ava{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.p-info{min-width:0;flex:1}
.p-email{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-id{color:var(--muted2);font-size:11px;margin-top:3px}
.plan{width:100%;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(79,140,255,.07));border:1px solid rgba(124,92,255,.18);border-radius:12px;text-align:left}
.plan b{color:#b3a8ff;font-size:12px;display:block}.plan small{color:var(--muted2);font-size:11px}

/* чат */
#chat{flex:1;overflow-y:auto;padding:26px 20px 200px;overscroll-behavior:contain}
.inner{width:100%;max-width:820px;margin:0 auto}
#welcome{min-height:calc(100vh - 270px);min-height:calc(var(--app-h,100dvh) - 270px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 12px}
.w-logo{width:76px;height:76px;border-radius:24px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;margin-bottom:22px;box-shadow:0 18px 60px rgba(100,90,255,.28)}
#welcome h2{font-size:31px;font-weight:800;letter-spacing:-.7px;margin-bottom:8px}
.w-hint{color:var(--muted2);font-size:14px;margin-bottom:28px}
.cards{width:100%;max-width:660px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:left;transition:.18s}
.card:hover{border-color:rgba(124,92,255,.4);transform:translateY(-2px)}
.c-ico{width:36px;height:36px;border-radius:10px;background:rgba(124,92,255,.12);color:#b3a8ff;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.c-t{font-size:14.5px;font-weight:650;margin-bottom:3px}.c-d{color:var(--muted2);font-size:12.5px}

/* сообщения */
.msg{display:flex;margin-bottom:24px;animation:in .22s ease}
.msg.me{justify-content:flex-end}
.msg>div{min-width:0}.msg.me>div{max-width:80%}.msg.ai>div{width:100%}
.content{font-size:16px;line-height:1.7;word-wrap:break-word}.content.raw{white-space:pre-wrap}
.msg.me .content{background:linear-gradient(180deg,rgba(124,92,255,.16),rgba(79,140,255,.09));border:1px solid rgba(124,92,255,.2);padding:10px 14px;border-radius:16px;line-height:1.5}
.content p{margin:8px 0}.content p:first-child{margin-top:0}.content p:last-child{margin-bottom:0}
.content pre{background:#06070a;border:1px solid var(--border);border-radius:11px;padding:13px;overflow-x:auto;margin:12px 0;font-size:13px;line-height:1.5}
.content code{font-family:Consolas,monospace;font-size:13.5px}
.content :not(pre)>code{background:rgba(255,255,255,.08);border-radius:5px;padding:2px 5px}
.content ul{margin:8px 0 8px 22px}.content li{margin:3px 0}
.content blockquote{border-left:3px solid var(--accent);background:rgba(124,92,255,.07);border-radius:0 10px 10px 0;padding:8px 14px;margin:10px 0;color:var(--muted)}
.content hr{border:0;height:1px;background:var(--border);margin:14px 0}
.content table{border-collapse:collapse;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--border);padding:7px 12px;text-align:left}.content th{background:rgba(124,92,255,.1)}
.content a{color:#8fb3ff}.msg.error .content{color:#ff9090}
.think{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;min-height:26px}
.orb{width:20px;height:20px;border-radius:50%;position:relative;flex-shrink:0;background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));animation:spin 1.1s linear infinite}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0b0b12}
.caret{color:var(--accent);animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.tb{display:flex;gap:2px;margin-top:6px;opacity:0;transition:.15s}.msg.ai:hover .tb{opacity:1}
.tb button{min-width:34px;height:32px;border-radius:8px;color:var(--muted2);font-size:14px}
.tb button:hover{background:var(--panel);color:var(--text)}.tb button.on{color:#b3a8ff;background:rgba(124,92,255,.1)}

/* ввод */
#inputbar{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:10px max(20px,calc((100% - 820px)/2)) max(30px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent)}
#attachbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(21,22,29,.9);border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:12.5px;max-width:260px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{color:var(--muted);padding:0 2px}.chip.err{color:#ff9090;border-color:rgba(255,80,80,.3)}
#inputrow{display:flex;align-items:flex-end;gap:6px;max-width:820px;margin:0 auto;padding:7px;background:rgba(21,22,29,.94);border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.32);transition:.16s}
#inputrow:focus-within{border-color:rgba(124,92,255,.4);box-shadow:0 12px 44px rgba(0,0,0,.32),0 0 0 3px rgba(124,92,255,.08)}
.round{width:40px;height:40px;flex-shrink:0;color:var(--muted);border-radius:12px;font-size:19px;display:flex;align-items:center;justify-content:center}
.round:hover{background:var(--hover);color:var(--text)}.round.on{color:#ff5252}
#inp{flex:1;min-height:40px;max-height:160px;background:transparent;border:0;outline:0;resize:none;color:var(--text);font-size:16px;line-height:1.45;padding:10px 4px}
#inp::placeholder{color:var(--muted2)}
#send{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--grad);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.14s}
#send:hover{transform:scale(1.06)}#send.stop{background:#25272e}#send:disabled{opacity:.55}
#scroll-bottom{position:fixed;right:22px;bottom:120px;z-index:40;width:38px;height:38px;border-radius:50%;background:rgba(21,22,29,.95);border:1px solid var(--border);color:var(--muted);opacity:0;visibility:hidden;transition:.2s}
#scroll-bottom.show{opacity:1;visibility:visible}
#dropzone{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(8,8,14,.85);backdrop-filter:blur(10px);font-size:21px}#dropzone.on{display:flex}

/* характер */
#prompt-panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;z-index:310;background:#111218;border-left:1px solid var(--border);padding:22px;transform:translateX(100%);transition:transform .25s var(--ease);display:flex;flex-direction:column;gap:12px}
#prompt-panel.open{transform:none}
#prompt-panel h3{font-size:17px}#prompt-panel small{color:var(--muted2);font-size:13px}
#prompt-text{flex:1;background:#0a0a10;border:1px solid var(--border);border-radius:12px;color:var(--text);padding:13px;font-size:14.5px;resize:none;outline:none}
.slider{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}.slider input{flex:1;accent-color:var(--accent)}.slider b{color:var(--text)}
.btn{height:46px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:14.5px}
.btn.ghost{background:none;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));z-index:100000;transform:translate(-50%,10px);background:rgba(22,23,31,.96);border:1px solid rgba(255,255,255,.1);padding:9px 14px;border-radius:10px;opacity:0;visibility:hidden;pointer-events:none;transition:.18s;font-size:13px}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* вход */
#authScreen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 18%,rgba(124,92,255,.16),transparent 40%),var(--bg);padding:20px;overflow-y:auto}
#authScreen.hidden{display:none}
.auth-box{width:100%;max-width:400px;text-align:center;animation:in .4s ease}
.auth-box .w-logo{width:66px;height:66px;border-radius:21px;font-size:29px;margin:0 auto 18px}
.auth-box h1{font-size:30px;margin-bottom:6px;letter-spacing:-.5px}.auth-box>p{color:var(--muted);margin-bottom:24px;font-size:15px}
.auth-box input{width:100%;height:52px;margin-bottom:11px;padding:0 15px;border-radius:13px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none;font-size:16px}
.auth-box input:focus{border-color:rgba(124,92,255,.7)}
.auth-box .btn{width:100%;height:52px}.auth-box .btn:disabled{opacity:.6}
.auth-2{width:100%;height:44px;margin-top:6px;color:var(--muted);font-size:14px}
.auth-or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted2);font-size:13px}.auth-or::before,.auth-or::after{content:"";height:1px;flex:1;background:var(--border)}
.google{width:100%;height:52px;border-radius:13px;background:var(--panel);border:1px solid var(--border);font-size:14.5px}
#authError{min-height:20px;margin-top:14px;color:#ff8080;font-size:13.5px}#authError.ok{color:#7fe0a8}

/* мобильная версия */
@media(max-width:820px){
  body::before,body::after{filter:blur(70px)}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);transform:translateX(-100%);box-shadow:20px 0 60px rgba(0,0,0,.4)}
  #sidebar.open{transform:none}#sb-close,#menu-btn{display:flex;align-items:center;justify-content:center}
  .h-item{padding:12px 10px;font-size:14.5px}
  header{padding:0 8px;gap:4px;height:56px;min-height:56px}.brand{display:flex}
  #model-select{max-width:128px;font-size:12px;padding:8px 24px 8px 10px}
  .pop{position:fixed;top:60px;right:10px;width:min(290px,calc(100vw - 20px))}
  #chat{padding:16px 14px 160px}
  #welcome{padding:16px 4px;min-height:calc(var(--app-h,100dvh) - 230px)}#welcome h2{font-size:25px}.w-logo{width:62px;height:62px;border-radius:19px;font-size:27px}
  .cards{gap:8px}.card{padding:14px 12px}.c-d{display:none}
  .msg.me>div{max-width:88%}.content pre{font-size:12.5px;padding:11px}
  .tb{opacity:1}.tb button{min-width:38px;height:36px}
  #inputbar{padding:6px 10px max(10px,env(safe-area-inset-bottom))}
  #inputrow{padding:6px}.round,#send{width:42px;height:42px}
  #scroll-bottom{right:14px;bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media(hover:none){.card:hover,#send:hover{transform:none}}
@media(max-width:360px){.cards{grid-template-columns:1fr}.card{display:flex;align-items:center;gap:10px}.c-ico{margin:0}#model-select{max-width:104px}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-top"><div class="mark">✦</div><div class="name grad-text">Aiva</div><button id="sb-close" type="button" aria-label="Закрыть">×</button></div>
    <button class="new-chat" id="new-chat" type="button"><span>＋</span><span>Новый чат</span></button>
    <div class="h-title">История</div>
    <div id="history"></div>
    <div class="sb-bottom"><button class="sb-act" id="sb-prompt" type="button"><span>🎭</span><span>Характер Aiva</span></button></div>
  </aside>
  <div id="sb-overlay"></div>

  <main id="main">
    <header>
      <button class="icon" id="menu-btn" type="button" aria-label="Меню">☰</button>
      <div class="brand"><div class="mark">✦</div><span class="grad-text">Aiva</span></div>
      <div class="spacer"></div>
      <select id="model-select" title="Модель">
        <option value="openai/gpt-oss-120b:free">GPT-OSS 120B · стабильная</option>
        <option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 120B · рассуждения</option>
        <option value="google/gemma-4-31b-it:free">Gemma 4 31B · быстрая</option>
        <option value="openrouter/free">Авто · случайная бесплатная</option>
        <option value="custom">Своя модель…</option>
      </select>
      <div class="wrap">
        <button class="icon" id="tools-btn" type="button" aria-label="Инструменты">⋯</button>
        <div class="pop" id="tools-pop">
          <button class="pi" id="t-new" type="button"><span>＋</span><span>Новый чат</span></button>
          <button class="pi" id="t-regen" type="button"><span>↻</span><span>Перегенерировать</span></button>
          <button class="pi" id="t-export" type="button"><span>↓</span><span>Экспорт чата</span></button>
          <button class="pi" id="t-prompt" type="button"><span>🎭</span><span>Характер Aiva</span></button>
          <div class="pdiv"></div>
          <button class="pi red" id="t-clear" type="button"><span>⌫</span><span>Очистить чат</span></button>
        </div>
      </div>
      <div class="wrap">
        <button class="profile-btn" id="profile-btn" type="button" aria-label="Профиль">A</button>
        <div class="pop" id="profile-pop">
          <div class="p-head"><div class="p-ava" id="p-ava">A</div><div class="p-info"><div class="p-email" id="p-email">Загрузка…</div><div class="p-id">ID: <span id="p-id">—</span></div></div></div>
          <button class="plan" id="plan-btn" type="button"><span><b>FREE</b><small>Бесплатный тариф</small></span><span>›</span></button>
          <div class="pdiv"></div>
          <button class="pi" id="p-settings" type="button"><span>⚙️</span><span>Настройки</span></button>

/* ---------- markdown ---------- */
function md(t){
  let h=String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const codes=[];
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{codes.push(c.replace(/^\n|\n$/g,""));return "%%C"+(codes.length-1)+"%%"});
  h=h.replace(/((?:^[ \t]*\|.*\|[ \t]*$\n?)+)/gm,(m,block)=>{
    const rows=block.trim().split("\n").map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    if(rows[0].length<2)return m;
    let head=rows[0],body=rows.slice(1);
    if(body.length&&body[0].every(c=>/^:?-{2,}:?$/.test(c)))body=body.slice(1);
    return "\n<table><thead><tr>"+head.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead>"+
      (body.length?"<tbody>"+body.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody>":"")+"</table>\n";
  });
  h=h.replace(/(^|\n)((?:[ \t]*[-*+] .*(?:\n|$))+)/g,(m,br,block)=>
    br+"\n<ul>"+block.trim().split("\n").map(l=>"<li>"+l.replace(/^[ \t]*[-*+] /,"")+"</li>").join("")+"</ul>\n");
  h=h.replace(/^&gt; (.*)$/gm,"<span class=qq>$1</span>");
  h=h.replace(/(?:^|\n)((?:<span class=qq>.*<\/span>\n?)+)/g,(m,b)=>"\n<blockquote>"+b.replace(/<\/?span class=qq>/g,"")+"</blockquote>\n");
  h=h.replace(/^\s*---+\s*$/gm,"\n<hr>\n");
  h=h.replace(/^#{1,6} (.*)$/gm,"<b>$1</b>");
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.split(/\n{2,}/).map(p=>/^<(pre|ul|table|blockquote|hr|div)/.test(p.trim())?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
  return h.replace(/%%C(\d+)%%/g,(m,i)=>"<pre><code>"+codes[+i]+"</code></pre>");
}
function render(el,text){el.classList.remove("raw");el.innerHTML=md(text)}

/* ---------- стрим ---------- */
async function streamRequest(url,payload,el){
  abortCtrl=new AbortController();
  sendBtn.disabled=false;sendBtn.textContent="■";sendBtn.classList.add("stop");
  let acc="";
  try{
    const r=await apiFetch(url,{method:"POST",signal:abortCtrl.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok||!r.body){
      let m="HTTP "+r.status;
      try{const ed=await r.json();if(ed.error)m=ed.error}catch(e){}
      throw new Error(m);
    }
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const line of lines){
        if(!line.trim())continue;
        let j;try{j=JSON.parse(line)}catch(e){continue}
        if(j.err){render(el,acc||"");addMsg("ai","⚠️ "+j.err,true);return acc}
        if(j.d){
          acc+=j.d;el.classList.add("raw");el.textContent=acc;
          const cr=document.createElement("span");cr.className="caret";cr.textContent="▍";el.appendChild(cr);
          chat.scrollTop=chat.scrollHeight;
        }
      }
    }
  }catch(e){
    if(e.name!=="AbortError"){addMsg("ai","⚠️ "+e.message,true);return acc}
  }
  return acc;
}

  const note=atts.map(a=>(a.type==="image"?"[🖼️ ":"[📄 ")+a.name+"]").join(" ");
  addMsg("user",(text+(note?"\n"+note:"")).trim());
  inp.value="";inp.style.height="auto";attachments=[];renderAttach();sendBtn.disabled=true;
  const el=addMsg("ai","");
  const timer=startThinking(el,atts.length?["Размышляет","Читает файл","Анализирует данные","Формирует ответ"]:["Размышляет","Анализирует запрос","Подбирает ответ","Формирует ответ"]);
  const acc=await streamRequest("/api/chat",{text,attachments:atts,stream:true,history:hist,model:currentModel()},el);
  clearInterval(timer);
  if(acc)render(el,acc);
  else{el.innerHTML="<i>Модель не ответила. Нажми ↻ или выбери другую модель.</i>";el.closest(".msg").classList.add("error")}
  chat.scrollTop=chat.scrollHeight;saveCurrentMessages();endGen();
}
sendBtn.onclick=()=>abortCtrl?abortCtrl.abort():send();
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>820){e.preventDefault();send()}});
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px"});

const PHS=["Спроси о чём угодно…","Напиши код, текст или идею…","Перетащи файл — разберу…","Объясни сложную тему просто…"];
let phIdx=0;
setInterval(()=>{if(document.activeElement!==inp&&!inp.value){phIdx=(phIdx+1)%PHS.length;inp.placeholder=PHS[phIdx]}},4000);

chat.addEventListener("scroll",()=>scrollBtn.classList.toggle("show",chat.scrollHeight-chat.scrollTop-chat.clientHeight>140));
scrollBtn.onclick=()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"});

/* ---------- инструменты чата ---------- */
async function regen(){
  closePops();
  if(abortCtrl)return;
  const ai=[...inner.querySelectorAll(".msg.ai")];if(!ai.length)return;
  ai[ai.length-1].remove();
  const el=addMsg("ai","",false,true);
  const timer=startThinking(el,["Размышляет","Перепроверяет ответ","Подбирает другой вариант","Формирует новую версию"]);
  const acc=await streamRequest("/api/regenerate",{stream:true},el);
  clearInterval(timer);
  acc?render(el,acc):(el.innerHTML="<i>Модель не ответила. Нажми ↻ или выбери другую модель.</i>");
  saveCurrentMessages();chat.scrollTop=chat.scrollHeight;endGen();
}
async function exportChat(){
  closePops();
  try{
    const r=await apiFetch("/api/config");const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Ошибка");
    const t=(d.history||[]).map(m=>"**"+(m.role==="user"?"Я":"Aiva")+":**\n\n"+m.content+"\n").join("\n---\n\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["# Aiva — экспорт чата\n\n"+t],{type:"text/markdown"}));
    a.download="aiva-chat.md";a.click();URL.revokeObjectURL(a.href);showToast("Экспорт готов");
  }catch(e){alert("Не удалось экспортировать чат.")}
}
async function clearChat(){
  closePops();
  if(!confirm("Очистить текущий диалог?"))return;
  try{await apiFetch("/api/clear",{method:"POST"})}catch(e){}
  const cur=getActiveChat();
  if(cur){cur.messages=[];cur.title="Новый чат";saveChats()}
  showWelcome();renderHistory();showToast("Чат очищен");
}
$("t-new").onclick=newChat;$("t-regen").onclick=regen;$("t-export").onclick=exportChat;
$("t-prompt").onclick=openPrompt;$("t-clear").onclick=clearChat;

/* ---------- голосовой ввод ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  micBtn.style.display="";
  let rec=null,recording=false;
  micBtn.onclick=()=>{
    if(recording){rec.stop();return}
    rec=new SR();rec.lang="ru-RU";rec.interimResults=false;
    rec.onresult=e=>{inp.value=(inp.value?inp.value+" ":"")+e.results[0][0].transcript;inp.dispatchEvent(new Event("input"))};
    rec.onend=rec.onerror=()=>{recording=false;micBtn.classList.remove("on")};
    recording=true;micBtn.classList.add("on");rec.start();
  };
}

/* ---------- модель ---------- */
async function setModel(m){
  try{await apiFetch("/api/model",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:m})})}catch(e){}
}
function ensureOption(v){if(![...modelSelect.options].some(o=>o.value===v))modelSelect.add(new Option(v,v),modelSelect.options[modelSelect.options.length-1])}
modelSelect.onchange=()=>{
  if(modelSelect.value==="custom"){
    const m=prompt("Вставь slug модели с openrouter.ai/models:",localStorage.aiva_custom||"");
    if(!m){modelSelect.value=localStorage.aiva_model||modelSelect.options[0].value;return}
    localStorage.aiva_custom=m;ensureOption(m);modelSelect.value=m;localStorage.aiva_model=m;setModel(m);
  }else{localStorage.aiva_model=modelSelect.value;setModel(modelSelect.value)}
  showToast("Модель выбрана");
};

/* ---------- характер ---------- */
$("close-prompt").onclick=()=>promptPanel.classList.remove("open");
tempInput.oninput=()=>$("temp-val").textContent=tempInput.value;
$("save-prompt").onclick=async()=>{
  try{
    const r=await apiFetch("/api/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemPrompt:$("prompt-text").value,temperature:parseFloat(tempInput.value)})});
    if(!r.ok){const d=await r.json();throw new Error(d.error||"Ошибка")}
    promptPanel.classList.remove("open");showToast("Настройки сохранены");
  }catch(e){alert("Не удалось сохранить настройки.")}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePops();promptPanel.classList.remove("open")}});

/* ---------- мобильные: клавиатура и свайп ---------- */
if(window.visualViewport){
  const setH=()=>{document.documentElement.style.setProperty("--app-h",visualViewport.height+"px");window.scrollTo(0,0);chat.scrollTop=chat.scrollHeight};
  visualViewport.addEventListener("resize",setH);setH();
}
let sx=null,sy=null;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);
  if(dy<40&&window.innerWidth<=820){
    if(sx<24&&dx>70)openSidebar();
    else if(dx<-70&&sidebar.classList.contains("open"))closeSidebar();
  }
  sx=null;
},{passive:true});

/* ---------- старт ---------- */
(async()=>{
  await authReady;
  loadChats();
  if(!chats.length)createChat();else activeChatId=chats[0].id;
  renderHistory();
  try{
    const r=await apiFetch("/api/config");const d=await r.json();
    if(!r.ok)throw new Error(d.error||"HTTP "+r.status);
    $("prompt-text").value=d.systemPrompt||"";
    if(d.temperature!=null){tempInput.value=d.temperature;$("temp-val").textContent=d.temperature}
    if(localStorage.aiva_custom)ensureOption(localStorage.aiva_custom);
    const saved=localStorage.aiva_model;
    if(saved){ensureOption(saved);modelSelect.value=saved;if(saved!==d.model)setModel(saved)}
    else if(d.model){ensureOption(d.model);modelSelect.value=d.model}
    if(!d.hasKey)addMsg("ai","⚠️ Ключ API не задан. Перезапусти сервер с AI_API_KEY.",true,true);
    const cur=getActiveChat();
    if(cur&&cur.messages.length)openChat(cur.id);else showWelcome();
  }catch(e){
    showWelcome();
    const{data}=await supabaseClient.auth.getSession();
    if(data.session)addMsg("ai","Не удалось загрузить конфигурацию: "+e.message,true,true);
  }
})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(err=>console.error("Service Worker:",err))});
}
</script>
