<!DOCTYPE html>
<html lang="ru">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0f">

<title>Aiva — AI Assistant</title>

<style>

:root{
  --bg:#0b0b0f;
  --sidebar:#101116;
  --panel:#15161b;
  --panel2:#1b1c22;
  --hover:#202128;
  --text:#f5f5f7;
  --muted:#999ca7;
  --muted2:#696c76;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.12);
  --accent:#7668ff;
  --accent2:#5c8cff;
  --user:#25272e;
  --success:#75e0a1;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(118,104,255,.045),
      transparent 40%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:2px solid rgba(118,104,255,.5);
  outline-offset:2px;
}


/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100%;
  display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar{
  width:270px;
  height:100%;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:12px;
  flex-shrink:0;
  transition:transform .25s ease;
  z-index:80;
}

.sidebar-top{
  display:flex;
  align-items:center;
  gap:9px;
  padding:4px 3px 14px;
}

.aiva-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 7px 25px rgba(100,90,255,.2);
  font-size:17px;
}

.aiva-name{
  font-size:16px;
  font-weight:700;
}

.sidebar-close{
  margin-left:auto;
  width:32px;
  height:32px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  display:none;
}

.sidebar-close:hover{
  background:var(--hover);
  color:var(--text);
}

.new-chat{
  width:100%;
  height:42px;
  border-radius:11px;
  background:var(--text);
  color:#0b0b0f;
  font-weight:650;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:
    transform .15s ease,
    opacity .15s ease;
}

.new-chat:hover{
  transform:translateY(-1px);
}

.new-chat:active{
  transform:scale(.985);
}

.history-title{
  color:var(--muted2);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:20px 8px 8px;
}

#history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  margin-bottom:3px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-size:13px;
  transition:
    background .15s ease,
    color .15s ease,
    transform .12s ease;
}

.history-item:hover{
  background:var(--hover);
  color:var(--text);
}

.history-item:active{
  transform:scale(.99);
}

.history-item.active{
  background:var(--panel2);
  color:var(--text);
}

.history-icon{
  width:20px;
  flex-shrink:0;
  color:var(--muted2);
}

.history-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.sidebar-action{
  width:100%;
  min-height:40px;
  padding:8px 10px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  transition:
    background .15s ease,
    color .15s ease;
}

.sidebar-action:hover{
  background:var(--hover);
  color:var(--text);
}


/* =========================================================
   MAIN
========================================================= */

#main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(11,11,15,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:20;
}

.menu-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:19px;
  display:none;
}

.menu-btn:hover{
  background:var(--panel);
  color:var(--text);
}

.header-brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.header-logo{
  width:35px;
  height:35px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 7px 22px rgba(100,90,255,.14);
  font-size:17px;
}

.brand{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand h1{
  font-size:15px;
  font-weight:700;
}

.sub{
  font-size:10px;
  color:var(--muted2);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:220px;
}

.spacer{
  flex:1;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.ghost{
  height:36px;
  padding:0 10px;
  background:transparent;
  color:var(--muted);
  border:1px solid transparent;
  border-radius:9px;
  transition:.15s;
}

.ghost:hover{
  background:var(--panel);
  color:var(--text);
  border-color:var(--border);
}

.icon-btn{
  width:36px;
  padding:0;
  font-size:16px;
}


/* =========================================================
   СТАРЫЕ ИНСТРУМЕНТЫ
   Остаются в DOM для существующего JS
========================================================= */

.legacy-tool-btn{
  display:none !important;
}


/* =========================================================
   КНОПКА ТРИ ТОЧКИ
========================================================= */

#aiva-more-btn{
  width:38px;
  height:38px;

  padding:0;

  margin:
    0 1px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    background .15s ease,
    color .15s ease,
    transform .12s ease;
}

#aiva-more-btn:hover{
  background:var(--panel);
  color:var(--text);
}

#aiva-more-btn.active{
  background:var(--panel);
  color:var(--text);
}

#aiva-more-btn:active{
  transform:scale(.94);
}

#aiva-more-btn svg{
  width:21px;
  height:21px;
  display:block;
}


/* =========================================================
   TOOLS OVERLAY
========================================================= */

#aiva-tools-overlay{
  position:fixed;

  inset:0;

  z-index:290;

  background:
    rgba(0,0,0,.30);

  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .18s ease,
    visibility .18s ease;
}

#aiva-tools-overlay.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}


/* =========================================================
   TOOLS PANEL
========================================================= */

#aiva-tools-panel{
  position:fixed;

  top:0;
  right:0;
  bottom:0;

  width:300px;
  max-width:88vw;

  z-index:300;

  padding:16px 14px;

  background:
    linear-gradient(
      180deg,
      rgba(20,21,27,.99),
      rgba(14,15,20,.99)
    );

  border-left:
    1px solid var(--border2);

  box-shadow:
    -25px 0 75px
    rgba(0,0,0,.42);

  transform:
    translateX(100%);

  transition:
    transform .23s
    cubic-bezier(.22,.61,.36,1);

  overflow-y:auto;
}

#aiva-tools-panel.open{
  transform:none;
}

.aiva-tools-head{
  min-height:44px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 4px 14px;
}

.aiva-tools-title{
  font-size:16px;
  font-weight:700;
}

#aiva-tools-close{
  width:34px;
  height:34px;

  padding:0;

  border-radius:9px;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  transition:.15s;
}

#aiva-tools-close:hover{
  background:var(--hover);
  color:var(--text);
}

.aiva-tools-section{
  margin-top:4px;
}

.aiva-tools-section-title{
  padding:
    0 6px 8px;

  color:var(--muted2);

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.08em;
}

.aiva-tools-action{
  width:100%;
  min-height:48px;

  margin:3px 0;

  padding:
    0 12px;

  border-radius:11px;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;

  gap:11px;

  text-align:left;

  font-size:13px;

  transition:
    background .15s ease,
    color .15s ease,
    transform .12s ease;
}

.aiva-tools-action:hover{
  background:var(--hover);
  color:var(--text);
}

.aiva-tools-action:active{
  transform:scale(.985);
}

.aiva-tools-icon{
  width:24px;
  min-width:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
}

.aiva-tools-divider{
  height:1px;

  margin:
    14px 4px;

  background:var(--border);
}


/* =========================================================
   PROFILE
========================================================= */

.profile-wrap{
  position:relative;
  margin-left:5px;
  z-index:250;
}

.profile-btn{
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
  border:2px solid rgba(255,255,255,.10);
  box-shadow:
    0 6px 22px
    rgba(100,90,255,.25);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.profile-btn:hover{
  transform:scale(1.06);
  border-color:rgba(255,255,255,.22);
  box-shadow:
    0 8px 28px
    rgba(100,90,255,.35);
}

.profile-menu{
  position:absolute;

  top:49px;
  right:0;

  width:292px;

  background:
    linear-gradient(
      180deg,
      rgba(24,25,32,.98),
      rgba(17,18,23,.98)
    );

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius:17px;

  padding:9px;

  box-shadow:
    0 24px 70px
    rgba(0,0,0,.55),
    0 8px 25px
    rgba(0,0,0,.30);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transform:
    translateY(-7px)
    scale(.97);

  transform-origin:top right;

  transition:
    opacity .16s ease,
    transform .16s ease,
    visibility .16s ease;
}

.profile-menu.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:none;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
}

.profile-avatar-large{
  width:46px;
  height:46px;

  flex-shrink:0;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:#fff;

  font-size:17px;
  font-weight:800;

  box-shadow:
    0 7px 22px
    rgba(100,90,255,.25);
}

.profile-info{
  min-width:0;
  flex:1;
}

.profile-email{
  color:var(--text);

  font-size:13px;
  font-weight:650;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-user-id{
  color:var(--muted2);

  font-size:10px;

  margin-top:5px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-plan{
  width:100%;
  min-height:58px;

  padding:9px 10px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      135deg,
      rgba(118,104,255,.13),
      rgba(92,140,255,.07)
    );

  border:
    1px solid
    rgba(118,104,255,.16);

  border-radius:12px;

  cursor:pointer;

  transition:.16s;
}

.profile-plan:hover{
  background:
    linear-gradient(
      135deg,
      rgba(118,104,255,.18),
      rgba(92,140,255,.11)
    );

  border-color:
    rgba(118,104,255,.28);
}

.profile-plan-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-plan-icon{
  width:32px;
  height:32px;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(118,104,255,.17);

  color:#aaa1ff;

  font-size:15px;
}

.profile-plan-title{
  color:#aaa1ff;

  font-size:11px;
  font-weight:800;

  letter-spacing:.04em;
}

.profile-plan-subtitle{
  color:var(--muted2);

  font-size:10px;

  margin-top:2px;
}

.profile-plan-arrow{
  color:var(--muted2);

  font-size:20px;
}

.profile-divider{
  height:1px;

  background:var(--border);

  margin:
    7px 4px;
}

.profile-item{
  width:100%;
  height:43px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:
    0 10px;

  border-radius:10px;

  background:transparent;

  color:var(--muted);

  text-align:left;

  font-size:13px;

  transition:.15s;
}

.profile-item:hover{
  background:var(--hover);
  color:var(--text);
}

.profile-item-icon{
  width:20px;
  text-align:center;
  font-size:15px;
}

.profile-item-text{
  flex:1;
}

.profile-item-arrow{
  color:var(--muted2);
  font-size:17px;
}

.profile-item.logout{
  color:#ff7777;
}

.profile-item.logout:hover{
  background:rgba(255,75,75,.09);
  color:#ff9696;
}


/* =========================================================
   CHAT
========================================================= */

#chat{
  flex:1;

  overflow-y:auto;

  padding:
    25px 20px 170px;

  scroll-behavior:smooth;
}

.chat-inner{
  width:100%;
  max-width:820px;
  margin:0 auto;
}


/* =========================================================
   WELCOME
========================================================= */

#welcome{
  min-height:
    calc(100vh - 245px);

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:
    35px 15px;
}

.welcome-logo{
  width:74px;
  height:74px;

  border-radius:23px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  font-size:34px;

  margin-bottom:22px;

  box-shadow:
    0 15px 60px
    rgba(91,105,255,.22);

  animation:
    welcomeFloat
    4s ease-in-out infinite;
}

@keyframes welcomeFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }

}

#welcome h2{
  font-size:30px;

  font-weight:650;

  letter-spacing:-.8px;

  margin-bottom:8px;
}

#welcome p{
  color:var(--muted);

  font-size:14px;

  margin-bottom:28px;
}

.quick-actions{
  width:100%;

  max-width:680px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;
}

.quick-card{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.028),
      rgba(255,255,255,.018)
    );

  border:
    1px solid
    var(--border);

  border-radius:13px;

  padding:15px;

  color:var(--text);

  text-align:left;

  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.quick-card:hover{
  background:var(--panel);

  border-color:
    rgba(255,255,255,.15);

  transform:
    translateY(-1px);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.16);
}

.quick-icon{
  font-size:18px;
  margin-bottom:7px;
}

.quick-title{
  font-size:13px;

  font-weight:650;

  margin-bottom:3px;
}

.quick-description{
  color:var(--muted2);

  font-size:11px;
}


/* =========================================================
   MESSAGES
========================================================= */

.msg{
  display:flex;

  gap:11px;

  margin-bottom:25px;

  animation:
    messageIn .2s ease;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

.msg .ava{
  width:30px;
  height:30px;

  flex-shrink:0;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;
}

.msg.ai .ava{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 7px 22px
    rgba(100,90,255,.12);
}

.msg.me{
  flex-direction:row-reverse;
}

.msg.me .ava{
  background:#24262d;
}

.msg > div:nth-child(2){
  min-width:0;
  max-width:78%;
}

.content{
  background:transparent;

  border:0;

  padding:
    1px 0;

  font-size:15px;

  line-height:1.65;

  white-space:pre-wrap;

  word-wrap:break-word;
}

.msg.me .content{
  background:var(--user);

  border:
    1px solid
    var(--border);

  padding:
    10px 14px;

  border-radius:17px;

  line-height:1.5;
}

.content p{
  margin:7px 0;
}

.content p:first-child{
  margin-top:0;
}

.content p:last-child{
  margin-bottom:0;
}

.content pre{
  background:#08090c;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  padding:13px;

  overflow-x:auto;

  margin:12px 0;
}

.content code{
  font-family:Consolas,monospace;
  font-size:13px;
}

.content>code{
  background:
    rgba(255,255,255,.06);

  border-radius:5px;

  padding:
    2px 5px;
}

.msg.error .content{
  color:#ff8d8d;
}


/* =========================================================
   THINKING / STATUS AIVA
========================================================= */

.thinking-box{
  display:inline-flex;

  align-items:center;

  gap:9px;

  color:var(--muted);

  font-size:13px;

  min-height:26px;

  animation:
    thinkingAppear
    .2s ease;
}

@keyframes thinkingAppear{

  from{
    opacity:0;
    transform:translateY(3px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

.thinking-icon{
  width:24px;
  height:24px;

  flex-shrink:0;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      rgba(118,104,255,.24),
      rgba(92,140,255,.14)
    );

  color:#b6afff;

  animation:
    thinkingPulse
    1.5s ease-in-out infinite;
}

@keyframes thinkingPulse{

  0%,100%{
    transform:scale(1);
    opacity:.68;

    box-shadow:
      0 0 0
      rgba(118,104,255,0);
  }

  50%{
    transform:scale(1.08);
    opacity:1;

    box-shadow:
      0 0 20px
      rgba(118,104,255,.18);

async function checkAuth(){

  try{

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if(data.session){

      updateProfile(
        data.session.user
      );

      hideAuthScreen();


    }else{

      updateProfile(
        null
      );

      showAuthScreen();

    }


    return data.session || null;


  }catch(error){

    console.error(
      "Session error:",
      error
    );

    updateProfile(
      null
    );

    showAuthScreen();

    return null;

  }

}

/* =========================================================
   AUTHORIZED API
========================================================= */

async function apiFetch(
  url,
  options = {}
){

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  const headers =
    new Headers(
      options.headers || {}
    );


  if(session?.access_token){

    headers.set(
      "Authorization",
      `Bearer ${session.access_token}`
    );

  }


  return fetch(
    url,
    {
      ...options,
      headers
    }
  );

}

      true;

            email,

            password

          });

      }else{

        result =
          await supabaseClient.auth.signInWithPassword({

            email,

            password

          });

      }


      if(result.error){

        showAuthError(
          result.error.message
        );

        return;

      }


      if(
        isSignup &&
        !result.data.session
      ){

        showAuthSuccess(
          "Аккаунт создан. Проверьте почту для подтверждения."
        );

        return;

      }


      if(result.data.user){

        updateProfile(
          result.data.user
        );

      }


      hideAuthScreen();


    }catch(error){

      console.error(
        "Auth error:",
        error
      );

      showAuthError(
        "Произошла ошибка. Попробуйте ещё раз."
      );


    }finally{

      authSubmit.disabled =
        false;

    }

  "aiva_chat_history_v1";


let chats = [];

let activeChatId =
  null;


function loadChats(){

  try{

    chats =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );


    if(!Array.isArray(chats)){

      chats = [];

    }


  }catch(e){

    chats = [];

  }

}


function saveChats(){

  try{

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(chats)
    );

  }catch(e){}

}


function createChat(){

  const chatData = {

    id:
      Date.now().toString(),

    title:
      "Новый чат",

    messages:[],

    created:
      Date.now()

  };


  chats.unshift(
    chatData
  );


  activeChatId =
    chatData.id;


  saveChats();

  renderHistory();

}


function getActiveChat(){

  return chats.find(
    c =>
      c.id === activeChatId
  );

}


function makeTitle(text){

  const clean =
    String(text)
      .replace(/\s+/g," ")
      .trim();


  if(!clean){

    return "Новый чат";

  }


  return clean.length > 38
    ? clean.slice(0,38) + "…"
    : clean;

}


function saveCurrentMessages(){

  const current =
    getActiveChat();


  if(!current){

    return;

  }


  const messages =
    [
      ...chatInner.querySelectorAll(
        ".msg"
      )
    ];


  current.messages =
    messages.map(
      m => {

        const role =
          m.classList.contains("me")
            ? "user"
            : "assistant";


        const content =
          m.querySelector(
            ".content"
          );


        return {

          role,

          content:
            content
              ? content.innerText
              : ""

        };

      }
    );


  const firstUser =
    current.messages.find(
      m =>
        m.role === "user"
    );


  if(firstUser){

    current.title =
      makeTitle(
        firstUser.content
      );

  }


  saveChats();

  renderHistory();

}


function renderHistory(){

  historyEl.innerHTML =
    "";


  chats
    .slice(0,30)
    .forEach(
      c => {

        const b =
          document.createElement(
            "button"
          );


        b.type =
          "button";


        b.className =
          "history-item" +
          (
            c.id === activeChatId
              ? " active"
              : ""
          );


        b.innerHTML = `

          <span class="history-icon">
            ◌
          </span>

          <span class="history-name"></span>

        `;


        b.querySelector(
          ".history-name"
        ).textContent =
          c.title ||
          "Новый чат";


        b.onclick =
          () =>
            openChat(c.id);


        historyEl.appendChild(
          b
        );

      }
    );

}

  if(abortCtrl){

    }catch(e){}

  }


  activeChatId =

  if(

/* =========================================================
   MARKDOWN
========================================================= */

function md(t){

  let h =
    String(t)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      );


  h =
    h.replace(
      /```(\w*)\n?([\s\S]*?)```/g,
      (m,l,c) =>
        "<pre><code>" +
        c.replace(
          /^\n|\n$/g,
          ""
        ) +
        "</code></pre>"
    );


  h =
    h.replace(
      /`([^`\n]+)`/g,
      "<code>$1</code>"
    );


  h =
    h.replace(
      /^###+ (.*)$/gm,
      "<b>$1</b>"
    );


  h =
    h.replace(
      /^## (.*)$/gm,
      "<b>$1</b>"
    );


  h =
    h.replace(
      /^# (.*)$/gm,
      "<b>$1</b>"
    );


  h =
    h.replace(
      /\*\*([^*]+)\*\*/g,
      "<b>$1</b>"
    );


  h =
    h
      .split(/\n{2,}/)
      .map(
        p =>
          /^<pre>/.test(
            p.trim()
          )
            ? p
            : "<p>" +
              p.replace(
                /\n/g,
                "<br>"
              ) +
              "</p>"
      )
      .join("");


  return h;

}


/* =========================================================
   VOICE OUTPUT
========================================================= */

function speak(text){

  if(
    !window.speechSynthesis
  ){

    return;

  }


  speechSynthesis.cancel();


  const lines =
    String(text)
      .replace(
        /[#*`>\-]/g,
        " "
      )
      .split("\n")
      .filter(
        x =>
          x.trim()
      )
      .slice(
        0,
        12
      );


  const u =
    new SpeechSynthesisUtterance(
      lines
        .join(". ")
        .slice(
          0,
          1200
        )
    );


  u.lang =
    "ru-RU";


  u.rate =
    1.05;


  speechSynthesis.speak(
    u
  );

}

function startThinking(
  contentEl,
  statuses
){

  let index =
    0;


  setThinkingStatus(
    contentEl,
    statuses[index]
  );


  const timer =
    setInterval(
      () => {

        index =
          (
            index + 1
          ) %
          statuses.length;


        setThinkingStatus(
          contentEl,
          statuses[index]
        );

      },
      1300
    );


  return timer;

}

      attachBar.appendChild(

async function uploadFiles(files){

  if(!files.length){

    return;

  }


  const fd =
    new FormData();


  [
    ...files
  ]
    .slice(
      0,
      5
    )
    .forEach(
      f =>
        fd.append(
          "files",
          f
        )
    );


  attachBtn.disabled =
    true;


  showToast(
    "Загружаю файл…"
  );


  try{

    const r =
      await apiFetch(
        "/api/upload",
        {
          method:
            "POST",

          body:
            fd
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        "Ошибка загрузки"
      );

    }


    (d.files || [])
      .forEach(
        f => {

          if(
            attachments.length < 5
          ){

            attachments.push(
              f
            );

          }

        }
      );


    renderAttach();


    showToast(
      "Файл готов"
    );


  }catch(e){

    addMsg(
      "ai",
      "Ошибка загрузки: " +
      e.message,
      true
    );

  }


  attachBtn.disabled =
    false;


  fileInput.value =
    "";

}

/* =========================================================
   STREAM
========================================================= */

async function streamRequest(
  url,
  payload,
  contentEl
){

  abortCtrl =
    new AbortController();


  sendBtn.disabled =
    false;


  sendBtn.textContent =
    "■";


  sendBtn.classList.add(
    "stop"
  );


  let acc =
    "";


  try{

    const r =
      await apiFetch(
        url,
        {
          method:
            "POST",

          signal:
            abortCtrl.signal,

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if(
      !r.ok ||
      !r.body
    ){

      let message =
        "HTTP " +
        r.status;


      try{

        const errorData =
          await r.json();


        if(errorData.error){

          message =
            errorData.error;

        }

      }catch(e){}


      throw new Error(
        message
      );

    }


    const reader =
      r.body.getReader();


    const dec =
      new TextDecoder();


    let lineBuf =
      "";


    while(true){

      const {
        done,
        value
      } =
        await reader.read();


      if(done){

        break;

      }


      lineBuf +=
        dec.decode(
          value,
          {
            stream:true
          }
        );


      const lines =
        lineBuf.split(
          "\n"
        );


      lineBuf =
        lines.pop();


      for(
        const line of lines
      ){

        if(
          !line.trim()
        ){

          continue;

        }


        let j;


        try{

          j =
            JSON.parse(
              line
            );

        }catch(e){

          continue;

        }


        if(j.err){

          contentEl.innerHTML =
            md(
              acc || ""
            );


          addMsg(
            "ai",
            "⚠️ " +
            j.err,
            true
          );


          return acc;

        }


        if(j.d){

          acc +=
            j.d;


          contentEl.textContent =
            acc;


          chat.scrollTop =
            chat.scrollHeight;

        }

      }

    }


  }catch(e){

    if(
      e.name !==
      "AbortError"
    ){

      addMsg(
        "ai",
        "⚠️ " +
        e.message,
        true
      );


      return acc;

    }

  }


  return acc;

}

/* =========================================================
   SEND
========================================================= */

async function send(){

  const text =
    inp.value.trim();


  if(
    !text &&
    !attachments.length
  ){

    return;

  }


  if(!activeChatId){

    createChat();

  }


  const atts =
    attachments.filter(
      a =>
        a.type !==
        "error"
    );


  const attNote =
    atts
      .map(
        a =>
          a.type === "image"
            ? `[🖼️ ${a.name}]`
            : `[📄 ${a.name}]`
      )
      .join(" ");


  addMsg(
    "user",
    (
      text +
      (
        attNote
          ? "\n" +
            attNote
          : ""
      )
    ).trim()
  );


  inp.value =
    "";


  inp.style.height =
    "auto";


  attachments =
    [];


  renderAttach();


  sendBtn.disabled =
    true;


  const contentEl =
    addMsg(
      "ai",
      ""
    );


  const thinkingStatuses =
    atts.length
      ? [
          "Размышляет",
          "Просматривает файл",
          "Анализирует данные",
          "Формирует ответ"
        ]
      : [
          "Размышляет",
          "Анализирует запрос",
          "Подбирает ответ",
          "Формирует ответ"
        ];


  const thinkingTimer =
    startThinking(
      contentEl,
      thinkingStatuses
    );


  const acc =
    await streamRequest(
      "/api/chat",
      {
        text,

        attachments:
          atts,

        stream:
          true
      },
      contentEl
    );


  clearInterval(
    thinkingTimer
  );


  contentEl.innerHTML =
    acc
      ? md(acc)
      : "<i>(пусто)</i>";


  chat.scrollTop =
    chat.scrollHeight;


  saveCurrentMessages();


  endGen();

}

      }


      const mdText =
        (d.history || [])
          .map(
            m =>
              `**${
                m.role === "user"
                  ? "Я"
                  : "Aiva"
              }:**\n\n${m.content}\n`
          )
          .join(
            "\n---\n\n"
          );


      const blob =
        new Blob(
          [
            `# Aiva — экспорт чата\n\n${mdText}`
          ],
          {
            type:
              "text/markdown"
          }
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        URL.createObjectURL(
          blob
        );


      a.download =
        "aiva-chat.md";


      a.click();


      URL.revokeObjectURL(
        a.href
      );


      showToast(
        "Экспорт готов"
      );


    }catch(e){

      alert(
        "Не удалось экспортировать чат."
      );

    }

  };


/* =========================================================
   VOICE INPUT
========================================================= */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SR){

  micBtn.style.display =
    "";


  let rec =
    null;


  let recording =
    false;


  micBtn.onclick =
    () => {

      if(recording){

        rec.stop();

        return;

      }


      rec =
        new SR();


      rec.lang =
        "ru-RU";


      rec.interimResults =
        false;


      rec.onresult =
        e => {

          inp.value =
            (
              inp.value
                ? inp.value + " "
                : ""
            ) +
            e.results[0][0]
              .transcript;


          inp.dispatchEvent(
            new Event(
              "input"
            )
          );

        };


      rec.onend =
        () => {

          recording =
            false;


          micBtn.classList.remove(
            "on"
          );

        };


      rec.onerror =
        () => {

          recording =
            false;


          micBtn.classList.remove(
            "on"
          );

        };


      recording =
        true;


      micBtn.classList.add(
        "on"
      );


      rec.start();

    };

}


/* =========================================================
   PROMPT
========================================================= */

document
  .getElementById(
    "prompt-btn"
  )
  .onclick =
    () => {

      closeToolsPanel();

      promptPanel.classList.add(
        "open"
      );

    };


document
  .getElementById(
    "close-prompt"
  )
  .onclick =
    () =>
      promptPanel.classList.remove(
        "open"
      );


tempInput.oninput =
  () =>
    tempVal.textContent =
      tempInput.value;


document
  .getElementById(
    "save-prompt"
  )
  .onclick =
  async () => {

    try{

      const r =
        await apiFetch(
          "/api/prompt",
          {
            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                systemPrompt:
                  document.getElementById(
                    "prompt-text"
                  ).value,

                temperature:
                  parseFloat(
                    tempInput.value
                  )

              })

          }
        );


      if(!r.ok){

        const d =
          await r.json();


        throw new Error(
          d.error ||
          "Ошибка"
        );

      }


      promptPanel.classList.remove(
        "open"
      );


      showToast(
        "Настройки сохранены"
      );


    }catch(e){

      alert(
        "Не удалось сохранить настройки."
      );

    }

  };


/* =========================================================
   CLEAR CHAT
========================================================= */

document
  .getElementById(
    "clear-btn"
  )
  .onclick =
  async () => {

    if(
      !confirm(
        "Очистить текущий диалог?"
      )
    ){

      return;

    }


    try{

      await apiFetch(
        "/api/clear",
        {
          method:
            "POST"
        }
      );

    }catch(e){}


    const current =
      getActiveChat();


    if(current){

      current.messages =
        [];

      current.title =
        "Новый чат";


      saveChats();

    }


    showWelcome();

    renderHistory();


    showToast(
      "Чат очищен"
    );

  };


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeProfileMenu();

      closeToolsPanel();

      promptPanel.classList.remove(
        "open"
      );

    }

  }
);


/* =========================================================
   INIT
========================================================= */

(async () => {

  await authReady;


  loadChats();


  if(!chats.length){

    createChat();

  }else{

    activeChatId =
      chats[0].id;

  }


  renderHistory();


  try{

    const r =
      await apiFetch(
        "/api/config"
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        "HTTP " +
        r.status
      );

    }


    modelInfo.textContent =
      "Твой AI-ассистент";


    document.getElementById(
      "prompt-text"
    ).value =
      d.systemPrompt ||
      "";


    if(
      d.temperature != null
    ){

      tempInput.value =
        d.temperature;


      tempVal.textContent =
        d.temperature;

    }


    if(!d.hasKey){

      addMsg(
        "ai",
        "⚠️ Ключ API не задан.",
        true
      );

    }


    const current =
      getActiveChat();


    if(
      current &&
      current.messages.length
    ){

      openChat(
        current.id
      );

    }else{

      showWelcome();

    }


  }catch(e){

    showWelcome();


    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if(data.session){

      addMsg(
        "ai",
        "Не удалось загрузить конфигурацию: " +
        e.message,
        true
      );

    }

  }

})();

</script>
